# Watch every client and prospect site, every morning, and say only what changed.
#
# This is what the $60 a month actually buys: somebody noticing that a site went
# down on a Sunday, that a certificate expired, or that a domain lapsed — before
# the owner does. A run where nothing changed says nothing, because an alert that
# fires every day is an alert nobody reads.

name: Watch sites

on:
  schedule:
    - cron: '0 13 * * *'      # 6am Pacific, before the calling day starts
  workflow_dispatch:
    inputs:
      slug:
        description: 'One client only (blank = everything watched)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Find the runner's Chrome
        run: echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Watch
        run: ./cc watch ${{ inputs.slug }} | tee watch.log

      - name: Summarise
        run: |
          {
            echo "## Site watch — $(date -u '+%d %b %Y')"
            echo
            echo '```'
            cat watch.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # An issue is the alert. GitHub emails it, so it reaches a phone without
      # us building any notification plumbing of our own.
      - name: Raise an issue if anything is broken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '🔴' watch.log; then
            BODY=$(sed -n '/🔴/,$p' watch.log | head -60)
            TITLE="Site watch: something needs attention ($(date -u '+%d %b'))"
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$(jq -n --arg t "$TITLE" --arg b "$BODY

          Full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                    '{title:$t, body:$b, labels:["site-watch"]}')" > /dev/null
            echo "issue raised"
          else
            echo "nothing critical"
          fi

      - name: Commit the history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f watch.log
          git add watch/ clients/ || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Site watch $(date -u '+%Y-%m-%d')"
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          fi
