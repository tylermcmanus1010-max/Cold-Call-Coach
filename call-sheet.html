<title>San Diego Call Sheet</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;650;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f6f8f9; --card:#ffffff; --ink:#111a1f; --dim:#5a6b74; --rule:#dbe3e7;
  --accent:#0d5c63; --accent-soft:#e3f0f0;
  --go:#1c7a4f; --wait:#8a6100; --stop:#8d3535;
  --shadow:0 1px 2px rgba(16,32,40,.06);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --paper:#0d1418; --card:#151e24; --ink:#e7eef2; --dim:#8ea2ac; --rule:#25333b;
  --accent:#4fb3bb; --accent-soft:#123037;
  --go:#4bbd84; --wait:#d6a53a; --stop:#dd7b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --paper:#0d1418; --card:#151e24; --ink:#e7eef2; --dim:#8ea2ac; --rule:#25333b;
  --accent:#4fb3bb; --accent-soft:#123037;
  --go:#4bbd84; --wait:#d6a53a; --stop:#dd7b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--dim);font-size:13px;margin-top:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:18px 0 26px}
.tally div{background:var(--card);padding:11px 8px;text-align:center}
.tally b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.tally span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em}

h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--dim);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.overdue{border-color:var(--wait)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:650;letter-spacing:-.01em;line-height:1.25}
.meta{font-size:12px;color:var(--dim);margin-top:2px}
.chip{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.chip.go{background:color-mix(in srgb,var(--go) 15%,transparent);color:var(--go)}
.chip.wait{background:color-mix(in srgb,var(--wait) 18%,transparent);color:var(--wait)}
.chip.stop{background:color-mix(in srgb,var(--stop) 15%,transparent);color:var(--stop)}

.tel{display:inline-block;margin:10px 0 2px;font-size:22px;font-weight:600;
  letter-spacing:.01em;color:var(--accent);text-decoration:none}
.tel:hover{text-decoration:underline}
.say.hold{border-left-color:var(--wait);color:var(--wait)}

.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
  font-size:12.5px;font-weight:650;padding:9px 16px;border-radius:999px;cursor:default;
  background:var(--ink);color:var(--paper);box-shadow:0 6px 20px -8px rgba(0,0,0,.5)}
.savebar.saved{background:var(--go);color:#fff}
.savebar.error{background:var(--stop);color:#fff;cursor:pointer}
.note{font-size:13px;color:var(--accent);background:var(--accent-soft);
  border-radius:8px;padding:9px 11px;margin:10px 0 0;font-weight:600}
.needs{font-size:12.5px;color:var(--wait);background:color-mix(in srgb,var(--wait) 10%,transparent);
  border-radius:8px;padding:8px 10px;margin:10px 0 0}
.needs b{color:var(--wait)}
.fold{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
.fold summary{font-weight:600;color:var(--accent)}
.block{margin:10px 0 0}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:4px}
.block p{margin:0;font-size:13.5px;color:var(--ink)}
.block .file{font-size:12.5px;color:var(--accent)}
.block pre{margin:0;white-space:pre-wrap;font:12.5px/1.5 "IBM Plex Mono",ui-monospace,monospace;
  background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px;overflow-x:auto}
.hint{font-size:11.5px;color:var(--dim);margin-top:2px}
.say{font-size:13.5px;color:var(--dim);margin:6px 0 0;border-left:2px solid var(--rule);padding-left:10px}
.say b{color:var(--ink);font-weight:600}

.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
button,.lnk{font:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px;
  border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
button:hover,.lnk:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,.lnk:focus-visible,.tel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08);color:#fff}
button[disabled]{opacity:.4;cursor:default}

details{margin-top:8px}
summary{cursor:pointer;font-size:12px;color:var(--dim);padding:6px 0}
.dead .nm{color:var(--dim)}
.ro{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;
  font-size:13px;margin-bottom:16px}
footer{margin-top:32px;color:var(--dim);font-size:11.5px;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

    o.push('<div class="hint">Tap to copy, then paste into your dialer</div>');

    if(l.note){
      o.push('<p class="note"><b>Note:</b> ' + esc(l.note) + '</p>');
    }
    if(l.needs && l.needs.length){
      o.push('<p class="needs"><b>Screenshot me:</b> ' + esc(l.needs.join(', ')) +
             ' &mdash; from their Google listing</p>');
    }

    o.push('<div class="acts">');
    o.push('<button data-a="script" data-i="' + i + '">Phone script</button>');
    if(l.built) o.push('<button data-a="email" data-i="' + i + '">Email text</button>');
    o.push('<button data-a="copysearch" data-i="' + i + '">Copy for Google</button>');
    o.push('</div>');

    o.push('<details class="fold"><summary>What to say &amp; what to send</summary>');
    o.push('<div class="block"><div class="lbl">On the phone</div><p>' + esc(l.script) + '</p></div>');
    if(l.built){
      o.push('<div class="block"><div class="lbl">Attach</div><p class="mono file">' + esc(l.file) + '</p></div>');
      o.push('<div class="block"><div class="lbl">Subject</div><p>' + esc(l.subject) + '</p></div>');
      o.push('<div class="block"><div class="lbl">Email</div><pre>' + esc(l.body) + '</pre></div>');
    } else {
      o.push('<div class="block"><div class="lbl">No page yet</div><p>Ask me to build it before you send anything.</p></div>');
    }
    o.push('</details>');

    o.push('<div class="acts">');
    o.push('<button data-a="tried" data-i="' + i + '">No answer</button>');
    if(l.status !== 'sent') o.push('<button class="primary" data-a="sent" data-i="' + i + '">Sent it</button>');
    else o.push('<button class="primary" data-a="won" data-i="' + i + '">They said yes</button>');
    o.push('<button data-a="dead" data-i="' + i + '">Not interested</button>');
    o.push('</div>');
  } else {
    o.push('<div class="acts"><button data-a="revive" data-i="' + i + '">Bring back</button></div>');
  }
  o.push('</div>');
  return o.join('');
}

function render(){
  var L = STATE.leads, ready=[], noPage=[], sent=[], won=[], dead=[];
  for(var i=0;i<L.length;i++){
    var l = L[i]; l._i = i;
    if(l.status==='dead') dead.push(l);
    else if(l.status==='won') won.push(l);
    else if(l.status==='sent') sent.push(l);
    else if(l.built) ready.push(l);
    else noPage.push(l);
  }
  sent.sort(function(a,b){ return daysSince(b.sentOn)-daysSince(a.sentOn); });
  ready.sort(function(a,b){ return (a.attempts-b.attempts) || a.name.localeCompare(b.name); });

  var h = [];
  h.push('<header><h1>San Diego Call Sheet</h1>');
  h.push('<div class="sub">Every business vetted so far &mdash; number, script, email and file in one place.</div></header>');
  h.push('<div class="tally">');
  h.push('<div><b class="mono">' + ready.length + '</b><span>Ready</span></div>');
  h.push('<div><b class="mono">' + sent.length + '</b><span>Sent</span></div>');
  h.push('<div><b class="mono">' + won.length + '</b><span>Won</span></div>');
  h.push('<div><b class="mono">' + dead.length + '</b><span>Dead</span></div>');
  h.push('</div>');

  if(canWrite === false) h.push('<div class="ro">Read-only view &mdash; buttons are off.</div>');

  if(sent.length){ h.push('<h2>Waiting on a reply</h2>');
    sent.forEach(function(l){ h.push(card(l,l._i)); }); }
  if(won.length){ h.push('<h2>Won</h2>');
    won.forEach(function(l){ h.push(card(l,l._i)); }); }

  h.push('<h2>Call these &mdash; ' + ready.length + '</h2>');
  ready.forEach(function(l){ h.push(card(l,l._i)); });

  if(noPage.length){
    h.push('<h2>Vetted, page not built yet &mdash; ' + noPage.length + '</h2>');
    noPage.forEach(function(l){ h.push(card(l,l._i)); });
  }
  if(dead.length){
    h.push('<details><summary>' + dead.length + ' dead &mdash; closed, chains, or not interested</summary>');
    dead.forEach(function(l){ h.push(card(l,l._i)); });
    h.push('</details>');
  }
  h.push('<div id="savebar" class="savebar" hidden></div>');
  h.push('<footer>Send me a screenshot of any Google listing and I will finish that page.</footer>');
  document.getElementById('app').innerHTML = h.join('');
  if(saveState !== 'idle') setSave(saveState);
}

// Every publish mints a version and reloads the view, so one publish per tap
// meant rapid taps collided: the later ones were rejected as conflicts and
// silently lost. Batch them, and always say whether the change actually saved.
var saveTimer = null, saveState = 'idle';

function setSave(s){
  saveState = s;
  var el = document.getElementById('savebar');
  if(!el) return;
  el.className = 'savebar ' + s;
  el.textContent = s === 'saving' ? 'Saving…'
    : s === 'saved'  ? 'Saved'
    : s === 'error'  ? 'Not saved — tap to retry'
    : '';
  el.hidden = (s === 'idle');
}

function doPublish(){
  if(!artifact){ setSave('error'); return; }
  setSave('saving');
  artifact.publish(PAGE(STATE, PAGE.toString(), CSS, APP)).then(function(){
    setSave('saved');
    setTimeout(function(){ if(saveState === 'saved') setSave('idle'); }, 1800);
  }).catch(function(e){
    var code = e && e.code;
    if(code==='not_writer'||code==='not_granted'||code==='not_declared'){ canWrite=false; render(); return; }
    // conflict means another view published first and this one is reloading to
    // it; anything else is worth showing rather than swallowing.
    setSave(code === 'conflict' ? 'saving' : 'error');
  });
}

function save(){
  clearTimeout(saveTimer);
  setSave('saving');
  saveTimer = setTimeout(doPublish, 700);
}

document.addEventListener('click', function(ev){
  if(ev.target.closest('#savebar')){ doPublish(); return; }
  var t = ev.target.closest('a.tel[data-copy]');
  if(t){ ev.preventDefault(); copyText(t.getAttribute('data-copy')); flash(t,'Copied'); return; }
  var b = ev.target.closest('button[data-a]');
  if(!b) return;
  var l = STATE.leads[+b.dataset.i], a = b.dataset.a;

  if(a==='script'){ copyText(l.script); flash(b,'Script copied'); return; }
  if(a==='email'){ copyText('Subject: ' + l.subject + '\n\n' + l.body); flash(b,'Email copied'); return; }
  if(a==='copysearch'){ copyText(l.name + ' ' + l.city + ' CA'); flash(b,'Copied for Google'); return; }

  if(a==='tried'){ l.attempts=(l.attempts||0)+1; l.lastTried=today(); }
  if(a==='sent'){ l.status='sent'; l.sentOn=today(); }
  if(a==='won'){ l.status='won'; }
  if(a==='dead'){ l.status='dead'; }
  if(a==='revive'){ l.status='new'; }
  render(); save();
});

render();
(async function(){
  try{ artifact = await claude.use('artifact'); canWrite = artifact ? null : false; }
  catch(e){ canWrite = false; }
  if(canWrite === false) render();
})();

</script>
