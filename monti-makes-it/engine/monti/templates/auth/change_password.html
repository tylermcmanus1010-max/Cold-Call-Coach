{% extends "base.html" %}
{% block title %}Change password · {{ company }}{% endblock %}
{% block body %}
<div class="container-narrow" style="padding:3rem 0">
  <div class="card card-lg">
    <h2>Change password</h2>
    {% if g.user.must_change_password %}
      <p class="muted" style="margin-top:.6rem;font-size:.9rem">You're using the temporary password we generated. Pick your own.</p>
    {% endif %}
    <form method="post" style="margin-top:1.5rem">{{ csrf_input() }}
      <label class="field"><span class="field-label">Current password</span>
        <input type="password" name="current_password" required autocomplete="current-password"></label>
      <label class="field"><span class="field-label">New password</span>
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
        <span class="field-hint">At least 8 characters.</span></label>
      <label class="field"><span class="field-label">Confirm new password</span>
        <input type="password" name="confirm_password" required autocomplete="new-password"></label>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
