# Finds the contact form on each callable lead's own website.
#
# Local egress is blocked, so this runs here like the scout. It reads and
# records. It submits nothing — see POLAR.md for how submitting is done.

name: Find contact forms

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many leads to check (blank = all callable ones)'
        required: false
        default: '40'

permissions:
  contents: write

jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            npx -y playwright@1.49.1 install --with-deps chromium
          fi

      - name: Find
        run: |
          set -o pipefail
          ./cc forms --limit "${{ inputs.limit }}" 2>&1 | tee forms.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Contact forms"
            echo ""
            echo '```'
            tail -80 forms.log 2>/dev/null || echo "no output"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outreach/ || true
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Contact forms found $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
