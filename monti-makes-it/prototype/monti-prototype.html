<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monti Makes It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Monti Makes It — the theme.
   Design tokens first, then chrome, then one block per surface.
   Themes: :root is light; prefers-color-scheme and [data-theme] override it,
   and every colour is defined on bare :root first so the un-stamped "system"
   state — which is what most viewers get — resolves as a complete set.

   Adopted wholesale from the prototype rather than approximated: Spectral for
   headings, IBM Plex Sans for text, IBM Plex Mono for anything numeric, a green
   and brass palette, a 3px radius, and the dimension-line rule borrowed from an
   engineering drawing. The engine's own surfaces — the ledger, the catalogue,
   the image viewer — are restyled into that language further down rather than
   left in the old one, because half a theme is worse than either. */
:root{
  --ground:#F6F8F5; --surface:#FFFFFF; --surface-2:#F0F4EF; --sunk:#EAEFE9;
  --ink:#101E18; --ink-2:#3A4C43; --muted:#66786E; --rule:#DAE2DA; --rule-soft:#E8EEE7;
  --green-deep:#0B5C3F; --green:#1E8F63; --green-soft:#E4F1EA;
  --brass:#8F6B1E; --brass-soft:#F4EEDE;
  --good:#1E8F63; --warn:#B07A16; --crit:#A8342B;
  --s1:#1E8F63; --s2:#4A63C8;
  --shadow:0 1px 2px rgba(16,30,24,.05), 0 8px 28px -18px rgba(16,30,24,.28);
  --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A100D; --surface:#111815; --surface-2:#161F1A; --sunk:#0D1410;
    --ink:#E7EEE8; --ink-2:#BCCCC1; --muted:#8FA398; --rule:#21302A; --rule-soft:#1A2621;
    --green-deep:#2E8A62; --green:#3FA97A; --green-soft:#12271E;
    --brass:#C79E48; --brass-soft:#241D0F;
    --good:#3FA97A; --warn:#D4A03C; --crit:#DE6B5E;
    --s1:#3FA97A; --s2:#6E7FDE;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0A100D; --surface:#111815; --surface-2:#161F1A; --sunk:#0D1410;
  --ink:#E7EEE8; --ink-2:#BCCCC1; --muted:#8FA398; --rule:#21302A; --rule-soft:#1A2621;
  --green-deep:#2E8A62; --green:#3FA97A; --green-soft:#12271E;
  --brass:#C79E48; --brass-soft:#241D0F;
  --good:#3FA97A; --warn:#D4A03C; --crit:#DE6B5E;
  --s1:#3FA97A; --s2:#6E7FDE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Spectral,Georgia,"Times New Roman",serif; font-weight:600; text-wrap:balance; margin:0; line-height:1.18}
h1{font-size:2.35rem; letter-spacing:-.015em}
h2{font-size:1.55rem; letter-spacing:-.01em}
h3{font-size:1.12rem}
p{margin:0}
/* The prototype set only the colour, because its links were all buttons. The
   app has real anchors everywhere — nav, rails, table cells — and an underline
   under every one of them turns a list into a wall of rules. Prose links keep
   theirs. */
a{color:inherit; text-decoration:none}
p a, .prose a, .rulelist a, li > a[href^="mailto"], a.reqlink{text-decoration:underline; text-underline-offset:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--green); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- chrome ---------- */
.wrap{max-width:1220px; margin:0 auto; padding:0 28px}
.topbar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex; align-items:center; gap:26px; height:58px}
.brand{display:flex; align-items:baseline; gap:9px; font-family:Spectral,serif; font-weight:700; font-size:1.04rem; letter-spacing:-.01em; white-space:nowrap}
.brand .mk{width:9px; height:9px; background:var(--green-deep); transform:rotate(45deg); align-self:center}
.brand small{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:500}
nav.screens{display:flex; gap:2px; margin-left:auto; flex-wrap:wrap}
nav.screens button{
  background:none; border:0; padding:7px 13px; cursor:pointer; color:var(--muted);
  font-size:.82rem; font-weight:500; border-radius:var(--r); white-space:nowrap;
}
nav.screens button:hover{color:var(--ink); background:var(--surface-2)}
nav.screens button[aria-current="true"]{color:var(--surface); background:var(--green-deep)}
.acct{display:flex; align-items:center; gap:9px; padding-left:18px; border-left:1px solid var(--rule); white-space:nowrap}
.avatar{width:26px; height:26px; border-radius:50%; background:var(--green-soft); color:var(--green-deep); display:grid; place-items:center; font-size:.65rem; font-weight:600; font-family:"IBM Plex Mono",monospace}

/* dimension-line rule: the engineering-drawing motif */
.dimrule{display:flex; align-items:center; gap:0; margin:0}
.dimrule::before,.dimrule::after{content:""; width:1px; height:9px; background:var(--rule)}
.dimrule i{flex:1; height:1px; background:var(--rule); display:block}

section.screen{display:none; padding:38px 0 90px}
section.screen.on{display:block}

.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.stack{display:flex; flex-direction:column}
.tag{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:2px; border:1px solid var(--rule); color:var(--muted); background:var(--surface-2)}
.tag.good{color:var(--good); border-color:color-mix(in srgb,var(--good) 34%, transparent); background:var(--green-soft)}
.tag.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 34%, transparent); background:var(--brass-soft)}
.tag.crit{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 34%, transparent); background:color-mix(in srgb,var(--crit) 9%, transparent)}
.tag.brass{color:var(--brass); border-color:color-mix(in srgb,var(--brass) 40%, transparent); background:var(--brass-soft)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 18px; border-radius:var(--r); border:1px solid var(--green-deep); background:var(--green-deep); color:#fff; font-weight:600; font-size:.86rem; cursor:pointer; transition:background .15s}
.btn:hover{background:var(--green)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px; font-size:.78rem}
table{width:100%; border-collapse:collapse; font-size:.85rem}
th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:500; padding:0 12px 8px 0; border-bottom:1px solid var(--rule)}
td{padding:9px 12px 9px 0; border-bottom:1px solid var(--rule-soft); vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right; padding-right:14px; font-variant-numeric:tabular-nums}
tr>th:last-child,tr>td:last-child{padding-right:0}
.scroll-x{overflow-x:auto}
/* ---------- screen 1 ---------- */
.intake-grid{display:grid; grid-template-columns:minmax(0,1.75fr) minmax(0,1fr); gap:22px; align-items:start}
.dropzone{
  display:flex; align-items:center; gap:16px; padding:22px; cursor:pointer;
  border:1px dashed color-mix(in srgb,var(--green) 45%, var(--rule));
  background:var(--surface-2); border-radius:var(--r); transition:background .15s,border-color .15s;
}
.dropzone:hover{background:var(--green-soft); border-color:var(--green)}
.dz-mark{color:var(--green-deep); flex:none; display:grid; place-items:center; width:52px; height:52px; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r)}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  background:var(--surface); border:1px solid var(--rule); color:var(--ink-2);
  padding:6px 12px; border-radius:100px; font-size:.8rem; cursor:pointer; transition:.15s;
}
.chip:hover{border-color:var(--green); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--green-deep); border-color:var(--green-deep); color:#fff}
.note-line{margin-top:12px; font-size:.85rem; color:var(--ink-2); padding-left:2px; min-height:2.6em}
.note-line .mono{color:var(--green); margin-right:8px}
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.qgrid label{display:flex; flex-direction:column; gap:6px; font-size:.78rem; color:var(--muted); font-weight:500}
.qgrid input{padding:9px 11px; border:1px solid var(--rule); background:var(--sunk); border-radius:var(--r); color:var(--ink); font-size:.88rem}
.qgrid input:focus{background:var(--surface); border-color:var(--green)}
.sidenote{border-left:2px solid var(--green-deep)}
.signer{display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:14px; border-top:1px solid var(--rule-soft)}

.mtb{margin-top:44px; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow)}
.mtb-head{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr); gap:24px; padding:32px 30px; align-items:center; background:linear-gradient(180deg,var(--brass-soft),transparent 78%)}
.boxart{color:var(--brass); max-width:280px; justify-self:end; width:100%}
.tracker{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); border-top:1px solid var(--rule)}
.tracker li{padding:18px 16px; border-right:1px solid var(--rule-soft); display:flex; flex-direction:column; gap:5px; font-size:.82rem; position:relative}
.tracker li:last-child{border-right:0}
.tracker li strong{font-weight:600; color:var(--muted); font-size:.84rem}
.tracker li .muted{font-size:.72rem}
.tracker .tk{
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-size:.7rem; font-weight:600;
  border:1px solid var(--rule); color:var(--muted); background:var(--surface-2);
}
.tracker li.done .tk{background:var(--green-deep); border-color:var(--green-deep); color:#fff}
.tracker li.done strong{color:var(--ink)}
.tracker li.now .tk{background:var(--brass); border-color:var(--brass); color:#fff}
.tracker li.now strong{color:var(--ink)}
.tracker li.now::after{content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--brass)}
@media (max-width:940px){
  .intake-grid{grid-template-columns:1fr}
  .mtb-head{grid-template-columns:1fr}
  .boxart{justify-self:start; max-width:220px}
  .tracker{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tracker li{border-bottom:1px solid var(--rule-soft)}
}
@media (max-width:600px){
  .wrap{padding:0 18px}
  h1{font-size:1.8rem}
  .qgrid{grid-template-columns:1fr}
  .tracker{grid-template-columns:1fr}
}
/* ---------- screen 2 ---------- */
.room-head{display:flex; gap:34px; justify-content:space-between; align-items:flex-end; flex-wrap:wrap}
.head-meta{display:flex; gap:26px; flex-wrap:wrap}
.head-meta div{display:flex; flex-direction:column; gap:3px}
.head-meta strong{font-size:.83rem; font-weight:500}
.room-grid{display:grid; grid-template-columns:288px minmax(0,1fr); gap:22px; align-items:start}
.controls{position:sticky; top:76px}
.qty-read{font-size:2.1rem; line-height:1.1; margin:4px 0 10px; letter-spacing:-.03em}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:3px; background:var(--rule); border-radius:2px; outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--green-deep); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--green-deep); cursor:grab}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--green-deep); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--green-deep); cursor:grab}
.rangeticks{display:flex; justify-content:space-between; margin-top:7px; font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted)}
.fieldrow{display:flex; flex-direction:column; gap:14px}
.fieldrow label{display:flex; flex-direction:column; gap:6px; font-size:.78rem; color:var(--muted); font-weight:500}
.fieldrow input{padding:8px 10px; border:1px solid var(--rule); background:var(--sunk); border-radius:var(--r); font-size:.88rem; width:100%}
.prefixed{display:flex; align-items:center; border:1px solid var(--rule); background:var(--sunk); border-radius:var(--r); padding-left:10px}
.prefixed span{font-family:"IBM Plex Mono",monospace; color:var(--muted); font-size:.85rem}
.prefixed input{border:0; background:transparent; padding-left:4px}
.seg{display:flex; margin-top:8px; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; background:var(--surface); border:0; border-right:1px solid var(--rule); padding:7px 4px; font-size:.76rem; cursor:pointer; color:var(--muted); white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--green-deep); color:#fff; font-weight:600}

.strategies{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.strat{display:flex; flex-direction:column; overflow:hidden}
.strat header{padding:18px 18px 14px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--rule-soft)}
.strat header h3{font-size:1.02rem}
.strat .price{padding:16px 18px 14px; background:var(--surface-2)}
.strat .big{font-size:2.25rem; line-height:1.05; letter-spacing:-.035em; margin:2px 0 6px}
.strat .sub{font-size:.72rem}
.strat .specs{margin:0; padding:14px 18px; display:flex; flex-direction:column; gap:9px; flex:1}
.strat .specs div{display:flex; justify-content:space-between; gap:14px; font-size:.8rem; align-items:baseline}
.strat dt{color:var(--muted); flex:none}
.strat dd{margin:0; text-align:right; font-weight:500}
.strat footer{padding:14px 18px; border-top:1px solid var(--rule-soft); display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.strat[data-s="cost"]{border-top:2px solid var(--good)}
.strat[data-s="fast"]{border-top:2px solid var(--warn)}
.strat[data-s="sure"]{border-top:2px solid var(--brass)}
.strat.hits .big{color:var(--green-deep)}

.wwntc{margin-top:22px}
.wwntc-head{display:flex; justify-content:space-between; gap:28px; flex-wrap:wrap; align-items:flex-start}
.gap-read{display:flex; gap:26px}
.gap-read p{font-size:1.35rem; margin-top:3px; letter-spacing:-.02em}
.recommend{margin:22px 0 20px; font-family:Spectral,serif; font-size:1.16rem; line-height:1.55; max-width:74ch; border-left:2px solid var(--green); padding-left:18px}
.recommend .chg{font-family:"IBM Plex Sans",sans-serif; font-size:.9rem; color:var(--ink-2)}
.recommend b{font-weight:600; background:var(--green-soft); padding:0 4px; border-radius:2px}
.levers{display:flex; flex-direction:column; gap:2px; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.lever{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center; padding:13px 16px; background:var(--surface); border-bottom:1px solid var(--rule-soft); cursor:pointer}
.lever:last-child{border-bottom:0}
.lever:hover{background:var(--surface-2)}
.lever input{accent-color:var(--green-deep); width:16px; height:16px}
.lever strong{font-size:.88rem; font-weight:600; display:block}
.lever em{font-style:normal; font-size:.78rem; color:var(--muted); display:block; margin-top:2px}
.lever .delta{font-size:.9rem; color:var(--green); font-weight:500; white-space:nowrap}
.outcome{margin-top:18px; padding:16px 18px; border-radius:var(--r); display:flex; gap:20px; align-items:center; flex-wrap:wrap; font-size:.9rem}
.outcome.hit{background:var(--green-soft); border:1px solid color-mix(in srgb,var(--green) 30%, transparent)}
.outcome.miss{background:var(--brass-soft); border:1px solid color-mix(in srgb,var(--brass) 30%, transparent)}
.outcome .num{font-size:1.5rem; letter-spacing:-.02em}
@media (max-width:1080px){
  .room-grid{grid-template-columns:1fr}
  .controls{position:static}
  .controls .pad{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 26px}
  .controls .dimrule{display:none}
}
@media (max-width:860px){
  .strategies{grid-template-columns:1fr}
  .gap-read{gap:18px}
}
@media (max-width:600px){ .controls .pad{grid-template-columns:1fr} }
/* ---------- screen 3 ---------- */
.genome-grid{display:grid; grid-template-columns:230px minmax(0,1fr); gap:26px; align-items:start}
.gindex{position:sticky; top:76px; display:flex; flex-direction:column; gap:1px; border-left:1px solid var(--rule); padding-left:0}
.gindex a{
  text-decoration:none; color:var(--muted); font-size:.82rem; padding:6px 12px;
  border-left:2px solid transparent; margin-left:-1px; transition:.15s;
}
.gindex a:hover{color:var(--ink); border-left-color:var(--rule)}
.gindex a.on{color:var(--green-deep); border-left-color:var(--green-deep); font-weight:600}
.grecord{display:flex; flex-direction:column; gap:18px}
.gsec{scroll-margin-top:78px}
.gsub{font-size:.84rem; margin-top:6px; margin-bottom:16px}
.gsec h2 + .scroll-x, .gsec h2 + .specgrid, .gsec h2 + .files{margin-top:16px}
.specgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px 22px}
.specgrid div{display:flex; flex-direction:column; gap:3px}
.specgrid strong{font-size:.87rem; font-weight:500}
.files{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.files li{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--rule-soft)}
.files li:last-child{border-bottom:0}
.ft{font-size:.62rem; letter-spacing:.06em; padding:4px 7px; border:1px solid var(--rule); border-radius:2px; color:var(--muted); background:var(--surface-2); min-width:46px; text-align:center}
.files strong{font-size:.86rem; font-weight:500; display:block}
.files em{font-style:normal; font-size:.76rem; color:var(--muted)}

.gold{background:linear-gradient(180deg,var(--brass-soft),transparent 70%); border-color:color-mix(in srgb,var(--brass) 28%, var(--rule))}
.goldhead{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,.7fr); gap:24px; align-items:center}
.goldart{color:var(--brass); max-width:190px; width:100%; justify-self:end}
.goldmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px 20px; margin-top:20px}
.goldmeta div{display:flex; flex-direction:column; gap:2px}
.goldmeta strong{font-size:.84rem; font-weight:500}

.meter-head{display:flex; justify-content:space-between; font-size:.82rem; margin-bottom:8px; color:var(--muted)}
.meter-head strong{color:var(--ink)}
.meter-track{height:8px; background:var(--sunk); border:1px solid var(--rule); border-radius:2px; overflow:hidden}
.meter-fill{height:100%; background:var(--good); border-radius:0 2px 2px 0}

.timeline{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column}
.timeline li{display:grid; grid-template-columns:104px minmax(0,1fr) auto; gap:16px; align-items:start; padding:14px 0; border-bottom:1px solid var(--rule-soft)}
.timeline li:last-child{border-bottom:0}
.tl-date{font-size:.74rem; color:var(--muted); padding-top:2px}
.timeline strong{font-size:.88rem; font-weight:600; display:block}
.timeline em{font-style:normal; font-size:.8rem; color:var(--muted); display:block; margin-top:3px}

.lessons{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:16px}
.lesson{border:1px solid var(--rule); border-radius:var(--r); padding:14px 15px; display:flex; flex-direction:column; gap:8px; background:var(--surface-2)}
.lesson strong{font-size:.88rem}
.lesson p{font-size:.79rem; line-height:1.5}
.lesson b{color:var(--ink); font-weight:600}

.chart{margin:18px 0 0; padding:0}
.chart svg{display:block; width:100%; height:auto; overflow:hidden}
.chart .legend{display:flex; gap:18px; margin-bottom:14px; font-size:.78rem; align-items:center; flex-wrap:wrap}

/* ==========================================================================
   Monti Makes It — the app, in the theme's language.

   Three parts, in this order:

     1. Aliases.   The engine's templates and the prototype grew different names
                   for the same idea — `.btn-primary` against `.btn`, `.tag-green`
                   against `.tag.good`, `.eyebrow-label` against `.eyebrow`.
                   Renaming forty templates to settle that would be a large diff
                   whose only effect is churn, so the names are reconciled here
                   instead, once, where the mapping is visible.

     2. The shell. The portal and admin bay run a sidebar rather than the
                   prototype's top nav — they have far more surfaces than six —
                   restyled into the same tokens.

     3. The rest.  The ledger, public catalogue, image viewer, tooling line,
                   orders and checkout: everything the prototype did not cover,
                   restyled here rather than left looking like the old theme.
   ========================================================================== */

/* ---------- 1. aliases ------------------------------------------------- */
/* Typography and utility names our templates already use. */
.eyebrow-label, .stat-label, .side-title, .field-label, .divider-label {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
}
.eyebrow-label { color: var(--green); }
.tiny { font-size: .78rem; }
.dim { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
.center { text-align: center; } .right { text-align: right; } .nowrap { white-space: nowrap; }
.grow { flex: 1; }
.measure { max-width: 62ch; }
.serif { font-family: Spectral, Georgia, serif; }
.container { width: min(1220px, 100% - 3.5rem); margin-inline: auto; }
.container-narrow { width: min(720px, 100% - 3.5rem); margin-inline: auto; }
.row { display: flex; gap: .75rem; align-items: center; }
.row-between { display: flex; gap: 1rem; align-items: center; justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: 1rem; }
.stack-sm > * + * { margin-top: .5rem; }
.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-sidebar { grid-template-columns: minmax(0, 1fr) 330px; align-items: start; }
@media (max-width: 1080px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-sidebar { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); } }

/* Buttons. The theme spells variants as `.btn.ghost`; ours spells them
   `.btn-ghost`. Both work. */
.btn-primary { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
.btn-primary:hover { background: var(--green); }
.btn-ghost, .btn-outline {
  background: transparent; color: var(--ink); border-color: var(--rule);
}
.btn-outline { color: var(--green-deep); border-color: var(--green-deep); }
.btn-ghost:hover, .btn-outline:hover { background: var(--surface-2); }
.btn-danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: .78rem; }
.btn-lg { padding: 12px 22px; font-size: .92rem; }
.btn-xl { padding: 14px 28px; font-size: 1rem; }
.btn-block { width: 100%; }
/* Every control keeps a 44px target on touch, whatever its visual size. */
@media (pointer: coarse) { .btn, .side-link, .seg button, .chip { min-height: 44px; } }

/* Tags and badges collapse onto the theme's one tag idiom. */
.tag-green, .badge-green { color: var(--good); border-color: color-mix(in srgb, var(--good) 34%, transparent); background: var(--green-soft); }
.tag-wait, .badge-amber { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, transparent); background: var(--brass-soft); }
.tag-muted, .badge-slate { color: var(--muted); border-color: var(--rule); background: var(--surface-2); }
.badge-red { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 34%, transparent); background: color-mix(in srgb, var(--crit) 9%, transparent); }
.badge-blue { color: var(--s2); border-color: color-mix(in srgb, var(--s2) 34%, transparent); background: color-mix(in srgb, var(--s2) 10%, transparent); }
.badge-brass { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 40%, transparent); background: var(--brass-soft); }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: "IBM Plex Mono", monospace; font-size: .66rem; letter-spacing: .08em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 2px;
  border: 1px solid var(--rule); color: var(--muted); background: var(--surface-2);
}
.tag-row { display: flex; flex-wrap: wrap; gap: .35rem; }

/* Cards. The theme separates the box (`.card`) from its padding (`.pad`); our
   templates expect padding on the card, so the aliases supply it. */
.card-lg, .card-quiet { padding: 22px 24px; }
.card-lg { padding: 26px 28px; }
.card-accent { border-left: 2px solid var(--green-deep); }
.card-flush { padding: 0; overflow: hidden; }
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 14px 20px; border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.card-head h3 { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: .88rem; font-weight: 600; }
.card-body { padding: 20px; }
.card:not(.card-flush):not(.card-lg):not(.card-quiet) { padding: 20px 22px; }

/* Stats. */
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 18px; }
.stat-value {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;
  font-size: 1.7rem; letter-spacing: -.03em; margin-top: .35rem; line-height: 1.1;
}
.stat-sub { font-size: .78rem; color: var(--muted); margin-top: .3rem; }
.stat-accent .stat-value { color: var(--green-deep); }
.delta { font-family: "IBM Plex Mono", monospace; font-size: .74rem; }
.delta.up, .up { color: var(--good); } .delta.down, .down { color: var(--crit); }
.delta.flat { color: var(--muted); }

/* Tables. The theme styles bare `table`; ours adds `.data` and a scroll box. */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.data th {
  text-align: left; font-family: "IBM Plex Mono", monospace; font-size: .64rem;
  letter-spacing: .11em; text-transform: uppercase; color: var(--muted);
  font-weight: 500; padding: 10px 14px 8px; border-bottom: 1px solid var(--rule);
  background: var(--surface-2); white-space: nowrap;
}
table.data td { padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data .right { text-align: right; }
.cell-link { font-weight: 500; cursor: pointer; }
.cell-link:hover { color: var(--green-deep); }

/* Forms. */
label.field { display: block; margin-bottom: 1rem; }
.field-label { display: block; margin-bottom: .35rem; }
.field-hint, .field-hint-top { display: block; font-size: .78rem; color: var(--muted); margin-top: .3rem; }
.field-hint-top { margin: -.1rem 0 .4rem; }
input[type=text], input[type=email], input[type=password], input[type=number],
input[type=date], textarea, select {
  width: 100%; padding: 9px 11px; font-size: .9rem;
  background: var(--sunk); color: var(--ink);
  border: 1px solid var(--rule); border-radius: var(--r);
}
input:focus, textarea:focus, select:focus {
  background: var(--surface); border-color: var(--green); outline: none;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
fieldset { border: 0; padding: 0; margin: 0 0 1.75rem; }
legend {
  font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--green); padding: 0 0 .75rem;
}

/* Notices, empty states, key-value lists, section rules. */
.notice {
  padding: 14px 16px; border-radius: var(--r); font-size: .88rem;
  border: 1px solid color-mix(in srgb, var(--good) 30%, transparent);
  background: var(--green-soft);
}
.notice strong { display: block; margin-bottom: .2rem; }
.notice-wait { background: var(--brass-soft); border-color: color-mix(in srgb, var(--brass) 34%, transparent); }
.notice-stop, .notice-error { background: color-mix(in srgb, var(--crit) 9%, transparent); border-color: color-mix(in srgb, var(--crit) 34%, transparent); }
.empty { padding: 3rem 1.5rem; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); }
.empty-icon { font-size: 1.6rem; color: var(--muted); display: block; margin-bottom: .6rem; }
.kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: .55rem 1rem; font-size: .88rem; }
.kv dt { color: var(--muted); font-size: .82rem; } .kv dd { margin: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: minmax(0, 1fr); gap: .1rem 0; } .kv dd { margin-bottom: .7rem; } }
.divider-label {
  display: flex; align-items: center; gap: .85rem; margin: 1.75rem 0 1rem;
}
.divider-label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.rule-top { border-top: 1px solid var(--rule-soft); }
.section { padding: clamp(2.5rem, 5vw, 4rem) 0; }
.section-lede { color: var(--ink-2); margin-top: .8rem; max-width: 58ch; }
.quiet-band { background: var(--surface-2); }

/* ---------- 2. the app shell ------------------------------------------ */
/* The portal and admin bay carry more surfaces than a top nav holds, so they
   keep a sidebar — restyled into the theme rather than left behind by it. */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  background: var(--surface-2); border-right: 1px solid var(--rule);
  padding: 1.1rem .8rem; display: flex; flex-direction: column; gap: 1.4rem;
}
.side-group { display: grid; gap: .1rem; }
.side-title { padding: 0 .6rem .4rem; }
.side-link {
  display: flex; align-items: center; gap: .65rem; padding: .5rem .6rem;
  border-radius: var(--r); color: var(--ink-2); font-size: .86rem; cursor: pointer;
  border: 0; border-left: 2px solid transparent; background: transparent;
  width: 100%; text-align: left; transition: background .14s, color .14s;
}
.side-link:hover { background: var(--sunk); color: var(--ink); }
.side-link.active {
  background: var(--green-soft); color: var(--green-deep);
  font-weight: 600; border-left-color: var(--green-deep);
}
.side-icon { width: 16px; text-align: center; opacity: .85; }
.side-count {
  margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: .66rem;
  color: var(--green-deep); background: var(--green-soft); padding: .05rem .4rem;
  border-radius: 100px;
}
.side-foot { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--rule); }
.main { min-width: 0; display: flex; flex-direction: column; }
.main-head {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  flex-wrap: wrap; padding: 1.2rem 2rem; border-bottom: 1px solid var(--rule);
  background: var(--surface); position: sticky; top: 0; z-index: 30;
}
.main-head .eyebrow { margin-bottom: .2rem; }
.main-head h1 { font-size: 1.75rem; }
.main-body { padding: 1.75rem 2rem; flex: 1; min-width: 0; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { flex-direction: row; overflow-x: auto; align-items: center; gap: .5rem; }
  .sidebar .side-title, .side-foot { display: none; }
  .side-group { display: flex; gap: .3rem; }
  .main-head { padding: 1rem 1.1rem; position: static; }
  .main-body { padding: 1.1rem; }
}

/* The public site's top bar, and the "viewing as" band. */
.topbar-inner { display: flex; align-items: center; gap: 1.5rem; height: 62px; }
.brand-mark {
  width: 9px; height: 9px; background: var(--green-deep); transform: rotate(45deg);
  align-self: center; flex: none;
}
.brand-name { font-family: Spectral, Georgia, serif; font-weight: 700; font-size: 1.02rem; }
.brand-sub {
  display: block; font-family: "IBM Plex Mono", monospace; font-size: .58rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.nav-links { display: flex; gap: 1.4rem; margin-left: auto; align-items: center; flex-wrap: wrap; }
.nav-links a { color: var(--muted); font-size: .85rem; cursor: pointer; text-decoration: none; }
.nav-links a:hover { color: var(--ink); }
.view-as-bar {
  background: var(--brass); color: #fff; padding: .5rem 0;
  font-family: "IBM Plex Mono", monospace; font-size: .7rem; letter-spacing: .1em;
  text-transform: uppercase;
}
.flash-stack { display: grid; gap: .5rem; padding: 1rem 2rem 0; }
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
.auth-card {
  width: min(430px, 100%); background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 2.2rem; box-shadow: var(--shadow);
}
.footer {
  border-top: 1px solid var(--rule); padding: 2.5rem 0 3rem;
  color: var(--muted); font-size: .84rem;
}
.footer a { color: var(--ink-2); cursor: pointer; text-decoration: none; }

/* ---------- 3. the surfaces the prototype did not cover ---------------- */

/* The transaction ledger (§11.5, §11.6). */
.ledger-search {
  display: grid; gap: .75rem; margin-bottom: 1.25rem; align-items: end;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  padding: 1rem; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--surface-2);
}
.ledger-search label.field { margin-bottom: 0; }
.ledger-search-actions { display: flex; gap: .5rem; }
.ledger-periods {
  display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 1.25rem;
  background: var(--sunk); padding: .25rem; border-radius: var(--r);
  border: 1px solid var(--rule); width: fit-content; max-width: 100%;
}
.ledger-period-btn {
  padding: .5rem .9rem; border-radius: var(--r); cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; text-decoration: none;
  font-family: "IBM Plex Mono", monospace; font-size: .74rem; letter-spacing: .05em;
  color: var(--muted); border: 0; background: transparent;
}
.ledger-period-btn:hover { color: var(--ink); }
.ledger-period-btn.active { background: var(--green-deep); color: #fff; }
.ledger-grand {
  display: flex; gap: 2.5rem; flex-wrap: wrap; align-items: flex-start;
  padding: 1.25rem; margin-bottom: 1.25rem; background: var(--surface);
  border: 1px solid var(--rule); border-left: 2px solid var(--green-deep);
  border-radius: var(--r);
}
/* A pending debit sits apart from the total it is deliberately not in (§11.4.3).
   In the same column it would read as revenue. */
.ledger-pending .stat-value { color: var(--warn); }
.ledger-table { font-variant-numeric: tabular-nums; }
.ledger-table th, .ledger-table td { white-space: nowrap; }
@media (max-width: 560px) { .ledger-search { grid-template-columns: minmax(0, 1fr); } }

/* The public catalogue (§8.2). */
.cat-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.cat-card {
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface);
  overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow);
}
.cat-card:hover { border-color: var(--green); }
.cat-card-media {
  aspect-ratio: 4 / 3; background: #FFFFFF; border-bottom: 1px solid var(--rule);
  display: grid; place-items: center; overflow: hidden;
}
.cat-card-media img, .cat-card-media svg { width: 100%; height: 100%; object-fit: cover; }
/* A white box and a question mark, not a drawing: a picture of a product we have
   not been sent is invented evidence. */
.cat-card-placeholder { font-family: "IBM Plex Mono", monospace; font-size: 2.2rem; color: var(--muted); }
.cat-card-body { padding: 1.1rem; display: grid; gap: .5rem; }
.cat-range {
  font-family: "IBM Plex Mono", monospace; font-size: 1.15rem; color: var(--green-deep);
  font-variant-numeric: tabular-nums;
}
.cat-range-note { font-size: .78rem; color: var(--muted); }
.cat-meta { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .82rem; color: var(--ink-2); }
.cat-cta { padding: 0 1.1rem 1.1rem; display: flex; gap: .5rem; flex-wrap: wrap; }

/* The item image viewer (§10.3). Sized for a thumb first. */
.iv-thumbs { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.iv-thumb { width: 100%; padding: 0; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--surface); cursor: zoom-in; overflow: hidden; text-align: left;
  display: flex; flex-direction: column; min-height: 44px; }
.iv-thumb:hover { border-color: var(--green); }
.iv-thumb-media { display: block; background: var(--sunk); }
.iv-thumb-media img, .iv-thumb-media svg { width: 100%; height: auto; display: block; }
.iv-thumb-caption { padding: .5rem .7rem; font-size: .8rem; color: var(--ink-2); line-height: 1.35; }
.iv-dialog { position: fixed; inset: 0; z-index: 90; display: grid;
  grid-template-rows: auto 1fr; background: color-mix(in srgb, var(--ink) 97%, transparent); }
/* `hidden` sets display:none from the UA stylesheet and any author `display`
   rule beats it, so these have to win or the dialog covers the page invisibly. */
.iv-dialog[hidden], .iv-callouts[hidden], .iv-slide[hidden] { display: none !important; }
body.iv-open { overflow: hidden; }
.iv-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .6rem max(0.35cm, .75rem); color: #fff; }
.iv-count { font-family: "IBM Plex Mono", monospace; font-size: .78rem; opacity: .8; }
.iv-tools { display: flex; gap: .4rem; }
.iv-btn { min-width: 44px; min-height: 44px; padding: 0 .7rem; background: transparent;
  color: #fff; border: 1px solid rgba(255,255,255,.28); border-radius: var(--r);
  font-size: 1.05rem; cursor: pointer; }
.iv-btn[aria-pressed="true"] { background: rgba(255,255,255,.18); }
.iv-diagram { font-size: .82rem; }
.iv-stage { display: grid; place-items: center; overflow: hidden; padding: 0 .5rem 1rem; }
.iv-slide { margin: 0; display: grid; gap: .75rem; max-width: min(96vw, 1100px); }
.iv-media { position: relative; display: grid; place-items: center;
  transition: transform .18s ease; transform-origin: center center; }
.iv-media img, .iv-media > svg:not(.iv-callouts) { max-width: 100%; max-height: 66vh;
  display: block; border-radius: var(--r); background: var(--surface); }
.iv-slide figcaption { color: #fff; font-size: .88rem; text-align: center;
  display: flex; flex-direction: column; gap: .2rem; }
.iv-source { font-family: "IBM Plex Mono", monospace; font-size: .7rem; opacity: .65; }
/* Callouts sit outside the subject on a leader line — a label over the part it
   names covers the part it names, and at 320px covers most of it. */
.iv-callouts { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.iv-callouts line { stroke: var(--brass); stroke-width: 1.25; }
.iv-callouts circle { fill: var(--brass); }
.iv-callouts text { fill: #fff; font-size: 12px; font-family: "IBM Plex Mono", monospace;
  paint-order: stroke; stroke: rgba(0,0,0,.85); stroke-width: 3px; }
.iv-nav { position: fixed; bottom: 1.1rem; width: 56px; height: 56px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.28); background: rgba(0,0,0,.55); color: #fff;
  font-size: 1.6rem; line-height: 1; cursor: pointer; }
.iv-prev { left: max(0.35cm, .9rem); } .iv-next { right: max(0.35cm, .9rem); }
@media (min-width: 860px) { .iv-nav { top: 50%; bottom: auto; transform: translateY(-50%); } }
.iv-empty { display: grid; gap: .6rem; justify-items: start; }
.iv-placeholder { width: 100%; max-width: 320px; aspect-ratio: 4 / 3;
  display: grid; place-items: center; background: #FFFFFF;
  border: 1px solid var(--rule); border-radius: var(--r);
  color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 2.6rem; }
.iv-placeholder-note { font-size: .78rem; color: var(--muted);
  font-family: "IBM Plex Mono", monospace; letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { .iv-media { transition: none; } }

/* The Tooling Line (§11.3) — four facts, and the materiality callout. */
.tooling { border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface);
  padding: 1rem 1.1rem; display: grid; gap: .5rem; margin: 0; }
.tooling dt { font-family: "IBM Plex Mono", monospace; font-size: .66rem;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tooling dd { margin: 0 0 .5rem; font-size: .92rem; line-height: 1.5; }
.tooling .cost { font-variant-numeric: tabular-nums; font-weight: 600; }
.tooling-callout { border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent);
  border-left-width: 3px; border-radius: var(--r); background: var(--brass-soft);
  padding: .9rem 1.05rem; font-size: .93rem; line-height: 1.55; margin-bottom: .85rem; }
.tooling-reused { color: var(--good); }

/* Decision Room controls, in the engine's server-rendered form. */
.dr-controls { display: grid; gap: 1.25rem; padding: 1.25rem;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.dr-control { display: flex; flex-direction: column; gap: .4rem; }
.dr-qty { font-family: "IBM Plex Mono", monospace; font-size: 1.9rem; font-weight: 600;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.dr-controls input[type=range] { width: 100%; accent-color: var(--green-deep); min-height: 44px; }
.rangeticks { display: flex; justify-content: space-between;
  font-family: "IBM Plex Mono", monospace; font-size: .66rem; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.seg button { flex: 1; min-height: 44px; background: var(--surface); border: 0;
  border-right: 1px solid var(--rule); padding: .5rem .4rem; font-size: .76rem;
  cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button.on, .seg button[aria-checked="true"] { background: var(--green-deep); color: #fff; font-weight: 600; }
.dr-tracker { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.dr-tracker li { padding: .9rem .8rem; border-right: 1px solid var(--rule-soft);
  display: flex; align-items: center; gap: .6rem; font-size: .84rem; color: var(--muted); }
.dr-tracker li:last-child { border-right: 0; }
.dr-tracker .tk { width: 22px; height: 22px; border-radius: 50%; display: grid;
  place-items: center; font-family: "IBM Plex Mono", monospace; font-size: .7rem;
  border: 1px solid var(--rule); background: var(--surface-2); flex: none; }
.dr-tracker li.done .tk { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
.dr-tracker li.now .tk { background: var(--brass); border-color: var(--brass); color: #fff; }
.dr-tracker li.done strong, .dr-tracker li.now strong { color: var(--ink); }
.strat { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.strat header { padding: 1rem 1.1rem .8rem; display: grid; gap: .5rem;
  border-bottom: 1px solid var(--rule-soft); }
.strat.hits { border-color: var(--green-deep); }
.strat.hits .strat-big { color: var(--green-deep); }
.strat-price { padding: 1rem 1.1rem; background: var(--surface-2); }
.strat-big { font-family: "IBM Plex Mono", monospace; font-size: 1.9rem; font-weight: 600;
  letter-spacing: -.035em; margin: .15rem 0 .35rem; font-variant-numeric: tabular-nums; }
.strat-specs { margin: 0; padding: .9rem 1.1rem; display: grid; gap: .55rem; flex: 1; }
.strat-specs div { display: flex; justify-content: space-between; gap: .9rem;
  font-size: .8rem; align-items: baseline; }
.strat-specs dt { color: var(--muted); }
.strat-specs dd { margin: 0; text-align: right; font-weight: 500; }
.strat footer { padding: .9rem 1.1rem; border-top: 1px solid var(--rule-soft); display: grid; gap: .5rem; }
.wwntc .gap-read { display: flex; gap: 1.75rem; flex-wrap: wrap; margin: 1.25rem 0; }
.outcome.hit { background: var(--green-soft); border: 1px solid color-mix(in srgb, var(--green) 30%, transparent); }
.outcome.miss { background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 30%, transparent); }
.outcome { margin-top: 1.1rem; padding: 1rem 1.1rem; border-radius: var(--r);
  display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; font-size: .9rem; }

/* The Product Genome index. */
.genome-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1.75rem;
  align-items: start; margin-top: 1.5rem; }
.gindex { position: sticky; top: 5rem; display: flex; flex-direction: column;
  border-left: 1px solid var(--rule); }
.gindex a { color: var(--muted); font-size: .82rem; padding: .4rem .75rem;
  border-left: 2px solid transparent; margin-left: -1px; min-height: 44px;
  display: flex; align-items: center; text-decoration: none; }
.gindex a:hover { color: var(--ink); border-left-color: var(--rule); }
.grecord { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
.gsec { scroll-margin-top: 5rem; }
@media (max-width: 1000px) {
  .genome-grid { grid-template-columns: minmax(0, 1fr); }
  .gindex { position: static; flex-direction: row; flex-wrap: wrap; border-left: 0;
    border-bottom: 1px solid var(--rule); padding-bottom: .6rem; gap: .25rem; }
}

/* Membership extras our version adds: unmeasured commitments and the rules. */
/* An unmeasured commitment is neither met nor missed and must not borrow the
   colour of either (E4.02). */
.commitlist b.unmeasured { color: var(--muted); font-style: italic; white-space: normal; }
.commitlist b.missed { color: var(--crit); }

/* Orders: the timeline, the money block, the freight offer. */
.track { list-style: none; margin: 0; padding: 0; display: grid; }
@media (min-width: 860px) { .track { grid-auto-flow: column; grid-auto-columns: 1fr; } }
.track-step { position: relative; padding: 0 0 1.25rem 1.75rem; }
@media (min-width: 860px) { .track-step { padding: 1.75rem .75rem 0 0; } }
.track-dot { position: absolute; width: 11px; height: 11px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--rule); left: 0; top: .35rem; }
@media (min-width: 860px) { .track-dot { top: 0; } }
.track-step::before { content: ""; position: absolute; background: var(--rule);
  left: 5px; top: 1.1rem; bottom: 0; width: 1px; }
@media (min-width: 860px) {
  .track-step::before { left: 11px; right: 0; top: 5px; bottom: auto; width: auto; height: 1px; }
  .track-step:last-child::before { display: none; }
}
.track-step.done .track-dot { background: var(--green-deep); border-color: var(--green-deep); }
.track-step.current .track-dot { box-shadow: 0 0 0 4px var(--green-soft); }

<body>
<div id="app"></div>

<script>
(function () {
"use strict";

/* ==========================================================================
   Data. Deterministic, so the numbers are stable every time the page loads.
   ========================================================================== */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd = mulberry(20260826);

var TODAY = new Date(2026, 7, 26);          // 26 Aug 2026, fixed
function addDays(d, n){var x=new Date(d); x.setDate(x.getDate()+n); return x;}
var FEE_PERCENT = 1.5;                 // our convenience fee
var CARD_PCT = 2.9, CARD_FIXED = 30;   // what Stripe charges, passed on at cost
var ACH_PCT = 0.8, ACH_CAP = 500;
function feeOn(cents){ return Math.round(cents * FEE_PERCENT / 100); }

/* What the network takes, grossed up so the net actually lands. */
function processingFor(net, method) {
  if (!net) return 0;
  if (method === "ach") {
    var gross = net / (1 - ACH_PCT / 100);
    return Math.min(Math.round(gross - net), ACH_CAP);
  }
  var g = (net + CARD_FIXED) / (1 - CARD_PCT / 100);
  return Math.round(g - net);
}

/* Freight and customs, the way a forwarder works it out. The figure is shown to
   the client struck through, so it has to be one we can defend line by line. */
var LANE = {SEA: {perKg: 260, min: 45000, days: 32}, AIR: {perKg: 720, min: 28000, days: 9}};
var DUTY = {"Bags & leather goods": 17.6, "Apparel & textiles": 14.9, "Packaging & print": 0,
            "Metal & machined parts": 2.9, "Molded plastics": 5.3, "Silicone & rubber": 3.4,
            "Ceramics & glass": 6.0, "Furniture & fixtures": 0, "default": 4.2};
var UNIT_G = {"Bags & leather goods": 620, "Apparel & textiles": 280, "Packaging & print": 45,
              "Metal & machined parts": 340, "Molded plastics": 120, "default": 300};
var UNIT_CM3 = {"Bags & leather goods": 2600, "Apparel & textiles": 900, "Packaging & print": 260,
                "Metal & machined parts": 420, "Molded plastics": 520, "default": 800};
function pick(t, k){ return t[k] !== undefined ? t[k] : t["default"]; }

function freightEstimate(valueCents, qty, category, destination, mode) {
  mode = LANE[mode] ? mode : "SEA";
  var lane = LANE[mode];
  var grams = pick(UNIT_G, category), cm3 = pick(UNIT_CM3, category);
  var actual = qty * grams / 1000, volumetric = qty * cm3 / 5000;
  var chargeable = Math.max(actual, volumetric);
  var freight = Math.max(lane.min, Math.round(chargeable * lane.perKg));
  var handling = 12500 + (destination === "United States" ? 18000 : 25000);
  var dutyRate = pick(DUTY, category);
  var duty = Math.round(valueCents * dutyRate / 100);
  var mpf = Math.min(62670, Math.max(3231, Math.round(valueCents * 0.3464 / 100)));
  var hmf = mode === "SEA" ? Math.round(valueCents * 0.125 / 100) : 0;
  return {
    mode: mode, days: lane.days, chargeable: chargeable, perKg: lane.perKg,
    freight: freight, handling: handling, dutyRate: dutyRate, duty: duty, mpf: mpf, hmf: hmf,
    destination: destination || "your address",
    total: freight + handling + duty + mpf + hmf,
    lines: [
      ["Chargeable weight (" + chargeable.toFixed(1) + " kg at $" + (lane.perKg / 100).toFixed(2) +
       "/kg, " + mode.toLowerCase() + ")", freight],
      ["Origin and destination handling", handling],
      ["Import duty (" + dutyRate + "% of declared value)", duty],
      ["Merchandise processing fee", mpf]
    ].concat(hmf ? [["Harbour maintenance fee", hmf]] : [])
  };
}
function money(c){var s=c<0?"-":""; c=Math.abs(Math.round(c));
  return s+"$"+(c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
/* Thousands separators for a unit count. The Decision Room quotes containers in
   the hundreds of thousands, where an unseparated 500000 is unreadable. */
function num(n){ return Math.round(n).toLocaleString("en-US"); }
function moneyShort(c){var v=Math.abs(c)/100;
  if(v>=1e6) return "$"+(v/1e6).toFixed(v>=1e7?0:1)+"M";
  if(v>=1e3) return "$"+(v/1e3).toFixed(v>=1e4?0:1)+"k";
  return "$"+v.toFixed(0);}
function fmtDate(d,opts){return d.toLocaleDateString("en-US",opts||{month:"short",day:"numeric"});}
function fmtFull(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* --- 365 days of orders, so revenue and order counts always agree --- */
var DAYS = [];
for (var i = 364; i >= 0; i--) {
  var date = addDays(TODAY, -i);
  var dow = date.getDay();
  var growth = 0.55 + 0.45 * ((365 - i) / 365);        // the business grows over the year
  var weekend = (dow === 0 || dow === 6) ? 0.22 : 1;
  var lambda = 2.1 * growth * weekend;
  var orders = 0, cents = 0, r = rnd();
  var n = Math.floor(lambda) + (r < (lambda % 1) ? 1 : 0);
  for (var k = 0; k < n; k++) {
    var size = 180000 + Math.floor(rnd() * 1400000);   // $1,800 – $15,800
    if (rnd() > 0.9) size += Math.floor(rnd() * 3600000);
    cents += size; orders++;
  }
  DAYS.push({date: date, cents: cents, orders: orders});
}
var HOURS = [];   // today, hour by hour
(function(){
  var todayTotal = DAYS[DAYS.length-1].cents, weights = [];
  for (var h = 0; h < 24; h++) {
    var w = (h >= 7 && h <= 19) ? 0.4 + rnd() : 0.05 + rnd() * 0.15;
    weights.push(w);
  }
  var sum = weights.reduce(function(a,b){return a+b;},0);
  for (var h2 = 0; h2 < 24; h2++) {
    HOURS.push({hour: h2, cents: Math.round(todayTotal * weights[h2] / sum)});
  }
})();

var RANGES = [
  {key:"1d",   days:1,   label:"1D"},
  {key:"7d",   days:7,   label:"7D"},
  {key:"21d",  days:21,  label:"21D"},
  {key:"45d",  days:45,  label:"45D"},
  {key:"90d",  days:90,  label:"90D"},
  {key:"180d", days:180, label:"180D"},
  {key:"365d", days:365, label:"365D"}
];

/* --- the five client accounts --- */
// Demo accounts. The names are placeholders for testing — swap them before anyone
// outside the team sees this, since a real person's name on a customer record
// reads as a real customer.
/* Account 1 is Boars Head, the real first client (Appendix B). The rest are
   scaffolding so the admin bay has more than one row to show, and they are
   named as scaffolding — the previous set was five real people's names, which
   on a customer record reads as five real customers. */

var CLIENTS = [1,2,3,4,5].map(function (n) {
  var joined = addDays(TODAY, -(140 - n * 17));
  return {
    id: n,
    ref: "MMI-C-" + (1000 + n),
    name: DEMO_NAMES[n-1],
    contact: DEMO_NAMES[n-1],
    email: n === 1 ? "orders@boars_head.example" : "demo" + n + "@montimakesit.example",
    phone: "+1 555 010" + n,
    country: ["United States","United States","United States","United Kingdom","United States"][n-1],
    city: [null,"Los Angeles","Oakland","London","Miami"][n-1],
    membership: "MEMBER",
    memberSince: joined,
    quoteLimit: n === 1 ? 16 : 10,
    cycleDays: 30,
    // The first account carries a tag, so the item tagged the same way appears in their portal.
    // Clients 2-5 carry none, so theirs stay quote-only.
    tags: n === 1 ? ["carry-out"] : [],
    freightWaived: n === 1,          // the owner absorbs freight on this account
    owner: "Tyler Monti"
  };
});

/* --- quote requests, spread across the clients --- */
var QUOTE_TITLES = [
  "Waxed canvas tote, 18L", "Kraft coffee pouch with valve", "Anodized carabiner, custom profile",
  "Airless pump bottle, 50ml", "Recycled ripstop packing cubes", "Solid oak side table, flat-pack",
  "Powder-coated shelf bracket", "Silicone gasket set, 60mm", "Retail box, rigid, magnetic close",
  "Stainless growler, 64oz", "Leather card holder", "Ceramic pour-over dripper"
];
var QUOTES = [];
(function(){
  var qn = 1000;
  // three requests deliberately left untriaged, so the incoming queue has work in it
  [[2, "Ceramic pour-over dripper, 2-cup", 3000, 4],
   [3, "Aluminium travel tin, 90mm", 8000, 9],
   [5, "Cotton drawstring dust bag", 15000, 20]].forEach(function (row) {
    QUOTES.push({
      ref: "MMI-Q-" + (++qn), clientId: row[0], title: row[1], qty: row[2],
      unit: null, total: null, status: "NEW",
      created: new Date(TODAY.getTime() - row[3] * 3600 * 1000),
      due: new Date(TODAY.getTime() + (24 - row[3]) * 3600 * 1000)
    });
  });
  CLIENTS.forEach(function (c, ci) {
    var count = [4, 2, 3, 2, 1][ci];
    for (var i = 0; i < count; i++) {
      var age = 2 + Math.floor(rnd() * 24);
      var status = i === 0 ? "ESTIMATE_SENT" : (rnd() > 0.55 ? "ESTIMATE_SENT" : "IN_REVIEW");
      if (i === 0 && ci % 2 === 0) status = "ACCEPTED";
      var qty = [500,1000,2500,5000,10000,25000][Math.floor(rnd()*6)];
      var unit = 80 + Math.floor(rnd() * 3200);
      QUOTES.push({
        ref: "MMI-Q-" + (++qn),
        clientId: c.id,
        title: QUOTE_TITLES[(ci * 3 + i) % QUOTE_TITLES.length],
        qty: qty,
        unit: unit,
        total: status === "NEW" || status === "IN_REVIEW" ? null : unit * qty + 120000 + Math.floor(rnd()*400000),
        status: status,
        created: addDays(TODAY, -age),
        due: addDays(TODAY, -age + 1)
      });
    }
  });
})();

/* --- the items catalog: what the floor can build. Nothing is assigned to a client yet. --- */
/* §11.3 — the Tooling Line. Four facts, and never a fifth: what it is, what it
   costs (one number), who owns it, and how it is being handled in the strategy
   on screen. What the tool cost us, its lifespan, its amortization internals —
   none of that is here, because none of it is ever shown. */
var TOOLING_OWNERSHIP =
  "You own it once it is paid for. We hold it, store it and maintain it here. " +
  "If you ever want it moved, we release it to you or to another factory at your cost.";

/* §11.3.4 — at or above 5% of landed unit cost the line is promoted to a
   callout above the price. The second sentence of that callout is mandatory:
   a high tooling percentage is bearable precisely because it does not recur,
   and a client who is not told that reads it as the real price. */
var TOOLING_THRESHOLD = 0.05;

function toolingLine(tool, qty, landedUnitCents) {
  var perUnit = tool.cost / qty;
  var share = landedUnitCents ? perUnit / landedUnitCents : 0;
  var material = share >= TOOLING_THRESHOLD;
  return {
    what: tool.what,
    cost: tool.cost,
    ownership: TOOLING_OWNERSHIP,
    treatment: "Spread across this " + qty.toLocaleString("en-US") + "-unit run — adds " +
               perUnitPrice(perUnit) + " per unit.",
    share: share,
    material: material,
    callout: material
      ? ("At this quantity, tooling is " + Math.round(share * 100) + "% of your unit cost. " +
         "It is a one-time charge of " + money(tool.cost) + " — your next run of the same item " +
         "has no tooling cost at all.")
      : null
  };
}

/* A third of a cent rendered as "$0.00" reads as free, and as "$0.0034000" it
   claims a precision we do not have. Four decimals, trailing zeros dropped. */
function perUnitPrice(cents) {
  var d = cents / 100;
  if (d >= 0.01) return money(cents);
  return "$" + String(d.toFixed(4)).replace(/0+$/, "").replace(/\.$/, "");
}

/* Appendix B: $0.20 → $0.14, driven by *both* order quantity and container
   spec. That is a matrix, not a line. Rows are spec tiers, columns are quantity
   tiers, and the corners are the two stated band ends. */
var BOARSHEAD_QTY_TIERS = [[20000, 49999], [50000, 149999], [150000, 499999], [500000, null]];
var BOARSHEAD_SPEC_TIERS = ["Plain — single size, no print", "One colour — logo, one panel",
                            "Full colour — wrap print", "Complex — window, coating or insert"];
var BOARSHEAD_GRID = [[17,16,15,14],[18,17,16,15],[19,18,17,16],[20,19,18,17]];

var CATALOG = [
  /* Boars Head's containers. `public` and `range` are the half everyone sees;
     `price` and `negotiated` are the half only the registered member sees, and
     §8.6 is explicit that the range is entered deliberately rather than derived
     from anyone's negotiated price. */
  {sku:"MMI-B-0101", name:"Branded carry-out container, 750ml", cat:"Packaging & print",
   materials:"Not confirmed — see the open questions on this item",
   price:16, moq:20000, lead:32, tags:["carry-out"], public:true,
   range:[14, 20],
   drivers:"how many you order, and how the container is specified — size, material, and how much " +
           "of it is printed. More units and a simpler print move you toward the bottom of the " +
           "range; smaller runs, full-wrap colour, a window or a coating move you up.",
   description:"Hinged-lid carry-out container in the 750ml size, printed to your artwork. " +
     "The everyday one — it is the volume line, and where the price band bottoms out.",
   tool:{ref:"MMI-T-2001", what:"One cutting die and four print plates.", cost:84000},
   negotiated:"Priced off your published quantity × spec matrix.",
   genome:[
     {section:"What it is", body:"Hinged-lid carry-out container, 750ml, printed to your artwork."},

function ledgerRows(opts) {

    if (opts.start && r.when < opts.start) return false;

                full: "Today, " + (h.hour % 12 === 0 ? 12 : h.hour % 12) + (h.hour < 12 ? "am" : "pm"),
                cents: h.cents, orders: null};

  var slice = DAYS.slice(DAYS.length - r.days);
  return {
    mode: r.days <= 21 ? "bar" : "area",
    points: slice.map(function (d) {
      return {label: fmtDate(d.date), full: fmtFull(d.date), cents: d.cents, orders: d.orders, date: d.date};
    })

}
function totalsFor(rangeKey) {
  var r = RANGES.filter(function(x){return x.key===rangeKey;})[0] || RANGES[1];
  var cur = DAYS.slice(DAYS.length - r.days);
  var prev = DAYS.slice(Math.max(0, DAYS.length - r.days * 2), DAYS.length - r.days);
  function sum(a, f){return a.reduce(function(t,d){return t + f(d);}, 0);}
  var revenue = sum(cur, function(d){return d.cents;});

  var pOrders = sum(prev, function(d){return d.orders;});
  return {
    revenue: revenue, orders: orders,
    aov: orders ? Math.round(revenue / orders) : 0,
    prevRevenue: pRev,
    revenueDelta: pRev ? (revenue - pRev) / pRev : null,
    ordersDelta: pOrders ? (orders - pOrders) / pOrders : null,

  var W = 1000, H = 260, PL = 56, PR = 16, PT = 18, PB = 30;
  var iw = W - PL - PR, ih = H - PT - PB;
  var max = Math.max.apply(null, pts.map(function(p){return p.cents;})) || 1;
  var niceMax = Math.ceil(max / 100000) * 100000 || 1;
  function x(i){ return pts.length === 1 ? PL + iw/2 : PL + (i / (pts.length - 1)) * iw; }
  function y(v){ return PT + ih - (v / niceMax) * ih; }

  var gridLines = "", axisY = "";
  for (var g = 0; g <= 4; g++) {
    var gv = niceMax * g / 4, gy = y(gv);
    gridLines += '<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'"/>';
    axisY += '<text x="'+(PL-10)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end">'+moneyShort(gv)+'</text>';
  }
  var body = "", endDot = "";
  if (s.mode === "area") {
    var d = pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.cents).toFixed(1);}).join(" ");
    body = '<path class="chart-area" d="'+d+' L '+x(pts.length-1).toFixed(1)+' '+(PT+ih)+' L '+x(0).toFixed(1)+' '+(PT+ih)+' Z"/>'
         + '<path class="chart-line" d="'+d+'"/>';
    endDot = '<circle class="chart-end" cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(pts[pts.length-1].cents).toFixed(1)+'" r="4.5"/>';
  } else {
    var slot = iw / pts.length, bw = Math.min(56, Math.max(3, slot - 8));
    body = pts.map(function (p, i) {
      var bx = PL + i * slot + (slot - bw) / 2;
      var by = y(p.cents), bh = Math.max(1, PT + ih - by);
      var cls = (s.mode === "hour" && i > new Date().getHours()) ? "chart-bar dim" : "chart-bar";
      return '<rect class="'+cls+'" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'"/>';
    }).join("");
  }
  var step = Math.max(1, Math.ceil(pts.length / 8)), axisX = "";
  pts.forEach(function (p, i) {
    if (i % step === 0 || i === pts.length - 1) {
      var tx = s.mode === "area" ? x(i) : PL + (i + 0.5) * (iw / pts.length);
      axisX += '<text x="'+tx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>';
    }
  });

  el.innerHTML =
    '<div class="chart-wrap">' +
      '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" ' +
        'aria-label="Revenue over the selected period, '+pts.length+' points">' +
        '<g class="chart-grid">'+gridLines+'</g>' +
        '<g class="chart-axis">'+axisY+axisX+'</g>' +
        body + endDot +
        '<line class="chart-cross" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" style="opacity:0"/>' +
        '<rect class="chart-hit" x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'"/>' +
      '</svg>' +
      '<div class="tooltip"></div>' +
    '</div>';

  var svg = el.querySelector("svg"), hit = el.querySelector(".chart-hit");
  var cross = el.querySelector(".chart-cross"), tip = el.querySelector(".tooltip");
  function at(evt) {
    var box = svg.getBoundingClientRect();
    var px = (evt.clientX - box.left) / box.width * W;
    var i;
    if (s.mode === "area") {
      i = Math.round((px - PL) / iw * (pts.length - 1));
    } else {
      i = Math.floor((px - PL) / (iw / pts.length));
    }
    i = Math.max(0, Math.min(pts.length - 1, i));
    var p = pts[i];
    var cx = s.mode === "area" ? x(i) : PL + (i + 0.5) * (iw / pts.length);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.style.opacity = 1;
    tip.style.opacity = 1;
    tip.style.left = (cx / W * 100) + "%";
    tip.style.top = (y(p.cents) / H * 100) + "%";
    tip.innerHTML = '<div class="t-date">' + esc(p.full) + '</div>' +
      '<div class="t-val">' + money(p.cents) + '</div>' +
      (p.orders != null ? '<div class="t-sub">' + p.orders + (p.orders === 1 ? " order" : " orders") + '</div>' : '');
  }
  hit.addEventListener("mousemove", at);
  hit.addEventListener("mouseleave", function () { cross.style.opacity = 0; tip.style.opacity = 0; });
}

function sparkline(values) {
  var W = 200, H = 34, max = Math.max.apply(null, values) || 1;
  var d = values.map(function (v, i) {
    return (i ? "L" : "M") + (i / (values.length - 1) * W).toFixed(1) + " " + (H - (v / max) * (H - 4) - 2).toFixed(1);
  }).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">' +
    '<path class="chart-line" d="'+d+'" stroke-width="1.6"/></svg>';
}

/* --- the item image viewer (§10.3) --------------------------------------
   One component, every surface that shows an item: the public catalogue, the
   member's own item page, the genome. Mobile is the first case rather than the
   fallback — a member opens this in a warehouse, on a phone, one-handed — so
   swipe moves between images, double-tap zooms, and every control is 44px.
   Pointer and keyboard get the same capability through the toolbar and arrow
   keys.

   An item with no images gets an explicit empty state, never blank space: a
   missing viewer on a portal item is a P1, and silence reads as a broken page
   rather than as an absence. */
function imageViewer(images, itemName, id) {
  /* No photograph yet: a plain white box with a question mark, deliberately not
     a drawing. Product photography is the client's own submission, so anything
     rendered in its place is a picture of a thing we have not seen — the same
     class of invention as a made-up price. The box holds the space the real
     photograph will occupy and is honest about being empty. */
  if (!images || !images.length) {
    return '<div class="iv-empty" data-iv-empty="' + esc(id) + '">' +
      '<div class="iv-placeholder" role="img" aria-label="No photograph of ' +
        esc(itemName) + ' yet"><span aria-hidden="true">?</span></div>' +
      '<p class="iv-placeholder-note">Photograph to come.</p></div>';
  }
  return '<div class="iv" data-iv="' + esc(id) + '">' +
    '<ul class="iv-thumbs">' + images.map(function (img, i) {
      return '<li><button type="button" class="iv-thumb" data-iv-open="' + i + '" ' +
        'aria-label="Open image ' + (i + 1) + ' of ' + images.length + ': ' + esc(img.caption) + '">' +
        '<span class="iv-thumb-media">' + img.svg + '</span>' +
        '<span class="iv-thumb-caption">' + esc(img.caption) + '</span></button></li>';
    }).join("") + '</ul>' +
    '<div class="iv-dialog" role="dialog" aria-modal="true" aria-label="' + esc(itemName) + ' images" hidden>' +
      '<div class="iv-bar">' +
        '<span class="iv-count"><span class="iv-now">1</span> / ' + images.length + '</span>' +
        '<span class="iv-tools">' +
          '<button type="button" class="iv-btn iv-diagram" aria-pressed="false">Diagram</button>' +
          '<button type="button" class="iv-btn iv-out" aria-label="Zoom out">&minus;</button>' +
          '<button type="button" class="iv-btn iv-in" aria-label="Zoom in">+</button>' +
          '<button type="button" class="iv-btn iv-close" aria-label="Close images">&times;</button>' +
        '</span></div>' +
      '<div class="iv-stage">' + images.map(function (img, i) {
        return '<figure class="iv-slide"' + (i ? ' hidden' : '') +
          (img.annotations ? " data-annotations='" + JSON.stringify(img.annotations) + "'" : "") + '>' +
          '<div class="iv-media">' + img.svg +
            '<svg class="iv-callouts" viewBox="0 0 100 100" preserveAspectRatio="none" hidden></svg>' +
          '</div>' +
          '<figcaption>' + esc(img.caption) +
            '<span class="iv-source">' + esc(img.source) + '</span></figcaption></figure>';
      }).join("") + '</div>' +
      '<button type="button" class="iv-nav iv-prev" aria-label="Previous image">&lsaquo;</button>' +
      '<button type="button" class="iv-nav iv-next" aria-label="Next image">&rsaquo;</button>' +
    '</div></div>';
}

function wireViewer(root) {
  var dialog = root.querySelector(".iv-dialog");
  if (!dialog) return;
  var slides = [].slice.call(root.querySelectorAll(".iv-slide"));
  var nowEl = root.querySelector(".iv-now");
  var diagramBtn = root.querySelector(".iv-diagram");
  var steps = [1, 1.75, 3];
  var index = 0, zoom = 0, opener = null;

  function applyZoom() {
    var media = slides[index].querySelector(".iv-media");
    if (media) media.style.transform = "scale(" + steps[zoom] + ")";
  }
  function drawCallouts() {
    var slide = slides[index], svg = slide.querySelector(".iv-callouts");
    if (!svg) return;
    var raw = slide.getAttribute("data-annotations");
    var on = diagramBtn && diagramBtn.getAttribute("aria-pressed") === "true";
    // `hidden` is a property of HTMLElement and an <svg> is an SVGElement, so
    // `svg.hidden = false` sets a JavaScript expando and leaves the attribute
    // exactly where it was. The attribute has to be moved directly.
    if (!raw || !on) { svg.setAttribute("hidden", ""); svg.innerHTML = ""; return; }
    var notes = JSON.parse(raw);

    /* Draw in the element's real pixel box rather than a normalised viewBox.
       A 0-100 box with preserveAspectRatio="none" stretches the glyphs along
       with the geometry, so labels came out distorted and oversized on a wide
       image — and a callout that is not legible is not a callout. */
    var box = svg.getBoundingClientRect();
    var w = box.width || 320, h = box.height || 240;
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    /* Labels sit against whichever edge is further from the point they name,
       at a fixed inset — so a callout never covers its own subject, and a long
       one never runs off the canvas at a narrow viewport. */
    var inset = Math.max(8, w * 0.03);
    svg.innerHTML = notes.map(function (n) {
      var x = (n.x || 50) / 100 * w, y = (n.y || 50) / 100 * h;
      var toLeft = x > w / 2;
      var lx = toLeft ? inset : w - inset;
      return '<line x1="' + x + '" y1="' + y + '" x2="' + lx + '" y2="' + y + '"/>' +
        '<circle cx="' + x + '" cy="' + y + '" r="3"/>' +
        '<text x="' + lx + '" y="' + (y - 6) + '" text-anchor="' +
        (toLeft ? "start" : "end") + '">' + esc(n.label) + '</text>';
    }).join("");
    svg.removeAttribute("hidden");
  }

  function render() {
    slides.forEach(function (s, i) { s.hidden = i !== index; });
    if (nowEl) nowEl.textContent = String(index + 1);
    if (diagramBtn) diagramBtn.hidden = !slides[index].getAttribute("data-annotations");
    applyZoom(); drawCallouts();
  }
  function move(d) { index = (index + d + slides.length) % slides.length; zoom = 0; render(); }
  function open(i, from) {
    index = i; zoom = 0; opener = from || null;
    dialog.hidden = false; document.body.classList.add("iv-open");
    render(); dialog.querySelector(".iv-close").focus();
  }
  function close() {
    dialog.hidden = true; document.body.classList.remove("iv-open");
    /* Focus returns to the thumbnail that opened the dialog. Dropping it on the
       body sends a keyboard user back to the top of a long catalogue page. */
    if (opener) opener.focus();
  }

  root.querySelectorAll("[data-iv-open]").forEach(function (thumb) {
    thumb.addEventListener("click", function () {
      open(parseInt(thumb.getAttribute("data-iv-open"), 10) || 0, thumb);
    });
  });
  dialog.querySelector(".iv-close").addEventListener("click", close);
  dialog.querySelector(".iv-prev").addEventListener("click", function () { move(-1); });
  dialog.querySelector(".iv-next").addEventListener("click", function () { move(1); });
  dialog.querySelector(".iv-in").addEventListener("click", function () {
    zoom = Math.min(steps.length - 1, zoom + 1); applyZoom(); });
  dialog.querySelector(".iv-out").addEventListener("click", function () {
    zoom = Math.max(0, zoom - 1); applyZoom(); });
  if (diagramBtn) diagramBtn.addEventListener("click", function () {
    var on = diagramBtn.getAttribute("aria-pressed") === "true";
    diagramBtn.setAttribute("aria-pressed", on ? "false" : "true");
    drawCallouts();
  });

  dialog.addEventListener("keydown", function (e) {
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowLeft") move(-1);
    else if (e.key === "+" || e.key === "=") { zoom = Math.min(steps.length - 1, zoom + 1); applyZoom(); }
    else if (e.key === "-") { zoom = Math.max(0, zoom - 1); applyZoom(); }
    else if (e.key === "0") { zoom = 0; applyZoom(); }
    else return;
    e.preventDefault();
  });

  var sx = 0, sy = 0, st = 0, lastTap = 0;
  var stage = dialog.querySelector(".iv-stage");
  stage.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, {passive: true});
  stage.addEventListener("touchend", function (e) {
    var tch = e.changedTouches[0], dx = tch.clientX - sx, dy = tch.clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 600) {
      move(dx < 0 ? 1 : -1); return;
    }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      var now = Date.now();
      if (now - lastTap < 320) { zoom = (zoom + 1) % steps.length; applyZoom(); lastTap = 0; }
      else lastTap = now;
    }
  }, {passive: true});

  render();
}

/* --- the public catalogue (§8) ------------------------------------------
   Open to everyone. What is gated is buying, not looking. These two views take
   no account and read no negotiated price: `publicItem` is the only serializer
   they use, so there is nothing customer-shaped in scope to leak. */
function publicItem(it) {
  return {sku: it.sku, name: it.name, cat: it.cat, description: it.description,
          range: it.range, typicalMoq: it.typicalMoq, typicalLead: it.typicalLead,
          drivers: it.drivers, images: it.images || []};
}

function rangeText(item) {
  if (!item.range) return null;
  var lo = item.range[0] / 100, hi = item.range[1] / 100;
  return lo === hi ? "$" + lo.toFixed(2) : "$" + lo.toFixed(2) + " – $" + hi.toFixed(2);
}

/* §8.5 — five viewer states, and no viewer ever sees an Order control they
   cannot use. This answers from the same registration test the order path
   would apply, so the button and the refusal cannot disagree. */
function ctaState(sku) {
  if (!S.user) return "ANONYMOUS";
  if (S.user.kind === "admin") return "ADMIN";
  var c = client(S.user.id);
  if (!c) return "ANONYMOUS";
  if (c.membership === "PAUSED") return "PAUSED";
  if (c.membership !== "MEMBER") return "NOT_MEMBER";
  var registered = itemsForClient(c).some(function (m) { return m.item.sku === sku; });
  return registered ? "ORDER" : "REQUEST";
}

function viewCatalogue() {

  return topbar() +
  '<section class="section" style="padding-top:clamp(3rem,7vw,5rem)"><div class="container-narrow">' +

      'back.</p>' +
    '<p class="tiny dim" style="margin-top:1rem;max-width:62ch">A published range is a range, ' +
      'not a quote: where a price lands inside one depends on how many you order and how the ' +
      'item is specified, and the listing says which. For anything without a range, ask and we ' +
      'will price it inside 24 hours. To buy, you need to be a member and the item needs to be ' +
      'registered to your account.</p>' +
  '</div></section>' +
  '<section class="section rule-top"><div class="container"><div class="cat-grid">' +
    items.map(function (item) {
      return '<article class="cat-card" data-cat="' + esc(item.sku) + '">' +
        '<div class="cat-card-media">' +
          (item.images.length
            ? item.images[0].svg
            : '<span class="cat-card-placeholder" role="img" aria-label="No photograph of ' +
              esc(item.name) + ' yet">?</span>') +
        '</div>' +
        '<div class="cat-card-body">' +
          '<div class="tiny mono dim">' + esc(item.cat) + '</div>' +

    : ('<div class="card" style="padding:0">' +

          'priced an item for you. Send us a request and anything we price and produce for you ' +

  } else if (S.portalTab === "purchases") {

  } else if (S.portalTab === "ledger") {
    body = '<p class="muted" style="max-width:62ch;margin-bottom:1.5rem">' +
      'Every purchase you have made, in one place. Switch between months, quarters ' +
      'and years — the same transactions grouped three ways, so the totals always ' +

      '<h3>Account</h3><dl class="kv" style="margin-top:1.25rem">' +

      '<dt>Contact</dt><dd>' + esc(c.contact) + '</dd>' +
