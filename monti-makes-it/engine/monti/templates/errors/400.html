{% extends "base.html" %}
{% block title %}400 · {{ company }}{% endblock %}
{% block body %}
<div class="container-narrow" style="padding:6rem 0;text-align:center">
  <div class="mono" style="color:var(--amber);font-size:.85rem;letter-spacing:.1em">ERROR 400</div>
  <h1 style="margin-top:.75rem">That request didn't check out</h1>
  <p class="muted" style="margin-top:1rem">Your session may have expired while the page was open. Sign in again and retry.</p>
  <div class="row" style="justify-content:center;margin-top:2rem">
    <a class="btn" href="{{ url_for('public.home') }}">Home</a>
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>
{% endblock %}
