# Serves site/ (built by tools/publish.js — rendered pitch pages only,
# plus the dashboard under /dash/) as static assets. Cloudflare Workers
# Builds runs the Build command below, then `npx wrangler deploy`, which
# reads this file.
#
# worker.js runs ONLY for /dash paths (run_worker_first), where it demands
# DASH_KEY before handing the asset back. Every other path is answered by the
# asset layer directly, the same as before the dashboard existed.
name = "cold-call-coach"
main = "worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = [ "/dash", "/dash/*" ]
