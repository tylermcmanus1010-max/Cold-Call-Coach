# Serves site/ (built by tools/publish.js — rendered pitch pages only,
# plus the dashboard under /dash/) as static assets. Cloudflare Workers
# Builds runs the Build command below, then `npx wrangler deploy`, which
# reads this file.
#
# worker.js runs ONLY for /dash paths (run_worker_first), where it demands
# DASH_KEY before handing the asset back. Every other path is answered by the
# asset layer directly, the same as before the dashboard existed.
name = "cold-call-coach"
main = "worker.js"
compatibility_date = "2026-01-01"

# mcmanuswebco.com is registered through Cloudflare on this account, so a
# deploy binds it here and writes the DNS records itself. The workers.dev
# address keeps working alongside it.
routes = [
  { pattern = "mcmanuswebco.com", custom_domain = true },
  { pattern = "www.mcmanuswebco.com", custom_domain = true },
]
# wrangler turns the workers.dev address off by default once routes exist.
# Keep it: pitch links already sent and the /dash/ bookmark use it.
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = [ "/dash", "/dash/*" ]
