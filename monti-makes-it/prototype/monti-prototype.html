}

/* ---------- purchased items + order timeline ---------- */
function timeline(o) {
  var stages = [
    ["Ordered", o.ordered, "Your order was created"],
    ["Paid", o.paid, "Funds confirmed" + (o.method ? " by " + (o.method === "ACH" ? "bank transfer" : "card") : "")],
    ["Reviewed", o.reviewed, "24h manufacturer review cleared"],
    ["In production", o.production, "On the floor"],
    ["Shipped", o.shipped, o.tracking ? (o.carrier + " · " + o.tracking) : "Left the factory"],
    ["Delivered", o.delivered, "Signed for"]
  ];
  var lastDone = -1;
  stages.forEach(function (st, i) { if (st[1]) lastDone = i; });
  return '<ol class="track">' + stages.map(function (st, i) {
    var done = !!st[1];
    return '<li class="track-step ' + (done ? "done " : "") + (i === lastDone ? "current" : "") + '">' +
      '<span class="track-dot" aria-hidden="true"></span><div class="track-body">' +
      '<div class="track-name">' + esc(st[0]) + '</div>' +
      (done ? '<div class="track-when">' + esc(fmtFull(st[1])) + '</div>' +
              '<div class="track-detail">' + esc(st[2]) + '</div>'
            : '<div class="track-when dim">—</div>') +
      '</div></li>';
  }).join("") + '</ol>' +
  (o.tracking
    ? '<div class="tracking-card"><div><div class="stat-label">Tracking</div>' +
      '<div class="mono" style="font-size:1.02rem;margin-top:.3rem">' + esc(o.tracking) + '</div>' +
      '<div class="tiny dim">' + esc(o.carrier || "Carrier") +
        (o.shipped ? " · shipped " + esc(fmtFull(o.shipped)) : "") + '</div></div>' +
      '<button class="btn btn-sm" data-copy="' + esc(o.tracking) + '">Copy code</button></div>'
    : (o.status === "IN_PRODUCTION" || o.status === "IN_REVIEW"
       ? '<p class="tiny dim" style="margin-top:1rem">A tracking code appears here the moment your order leaves the factory.</p>'
       : ''));
}

function purchasesView(c, orders) {
  if (!orders.length) {
    return '<div class="card" style="padding:0"><div class="empty" style="padding:4rem 2rem">' +
      '<h3 style="font-size:1.1rem">Nothing purchased yet</h3>' +
      '<p class="muted" style="margin:.8rem auto 0;max-width:50ch;font-size:.95rem">' +
      'Once you accept an estimate and pay, every item lands here with its own timeline — ordered, ' +
      'paid, reviewed, in production, shipped, delivered — and a tracking code as soon as it leaves ' +
      'the factory.</p>' +
      '<button class="btn btn-primary btn-lg" style="margin-top:1.75rem" data-act="quote-member">Describe it badly</button>' +
      '</div></div>';
  }
  var units = orders.reduce(function (t, o) { return t + o.qty; }, 0);
  var spend = orders.reduce(function (t, o) {
    if (o.total !== undefined) return t + o.total;
    var g = o.unit * o.qty;
    return t + g + feeOn(g) + processingFor(g + feeOn(g), o.method === "ACH" ? "ach" : "card");
  }, 0);
  var inFlight = orders.filter(function (o) { return o.status !== "DELIVERED"; }).length;
  return '<div class="grid grid-4">' +
      stat("Items bought", units.toLocaleString("en-US"), "across " + orders.length +
           (orders.length === 1 ? " order" : " orders")) +
      stat("Total spend", money(spend), "fees included", true) +
      stat("In flight", inFlight, "not yet delivered") +
      stat("Reorderable", itemsForClient(c).length, "in your catalog now") +
    '</div>' +
    '<div class="stack" style="margin-top:1.5rem">' + orders.map(function (o) {
      var m = {DELIVERED:["Delivered","green"], SHIPPED:["Shipped","green"],
               IN_REVIEW:["Manufacturer review","brass"], IN_PRODUCTION:["In production","blue"],
               PENDING:["Awaiting payment","amber"]}[o.status] || [o.status, "slate"];
      return '<div class="card card-flush">' +
        '<div class="card-head"><div class="row wrap" style="gap:.75rem">' +
          '<span class="mono tiny">' + esc(o.ref) + '</span>' +
          '<span class="badge badge-' + m[1] + '">' + esc(m[0]) + '</span>' +
          '<span class="tiny dim">ordered ' + esc(fmtFull(o.ordered)) + '</span></div>' +
          (o.tracking ? '<span class="tiny mono" style="color:var(--green)">' + esc(o.carrier) + ' ' + esc(o.tracking) + '</span>' : '') +
        '</div>' +
        '<div class="card-body" style="padding-bottom:.5rem">' + timeline(o) + '</div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
          '<th>Item</th><th class="right">Unit</th><th class="right">Qty</th><th class="right">Line total</th><th></th>' +
        '</tr></thead><tbody><tr>' +
          '<td><div style="font-weight:500">' + esc(o.name) + '</div>' +
          '<div class="tiny mono dim">' + esc(o.sku) + '</div></td>' +
          '<td class="right mono tnum">' + money(o.unit) + '</td>' +
          '<td class="right mono tnum">' + o.qty.toLocaleString("en-US") + '</td>' +
          '<td class="right mono tnum" style="font-weight:500">' + money(o.unit * o.qty) + '</td>' +
          '<td class="right"><button class="btn btn-sm" data-buy="' + esc(o.sku) + '">Reorder</button></td>' +
        '</tr></tbody>' +
        (function () {
          var g = o.goods !== undefined ? o.goods : o.unit * o.qty;
          var cf = o.convenienceFee !== undefined ? o.convenienceFee : feeOn(g);
          var pf = o.processingFee !== undefined ? o.processingFee
                   : processingFor(g + cf, o.method === "ACH" ? "ach" : "card");
          var tot = o.total !== undefined ? o.total : g + cf + pf;
          return '<tfoot>' +
            (o.freightWaived
              ? '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
                '<span class="sum-name">Freight &amp; customs</span>' +
                '<span class="free-tag">Client ' + esc(client(o.clientId).name) + ' marked as free in system</span>' +
                '</div></td><td class="right"><div class="sum-stack">' +
                '<span class="struck mono sum-was">' + money(o.freightEstimate || 0) + '</span>' +
                '<span class="mono sum-now">$0.00</span></div></td><td></td></tr>'
              : '') +
            '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
              '<span class="sum-name">Convenience fee</span>' +
              '<span class="sum-note">' + FEE_PERCENT + '% of the order</span></div></td>' +
              '<td class="right mono sum-amount">' + money(cf) + '</td><td></td></tr>' +
            '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
              '<span class="sum-name">Payment processing</span>' +
              '<span class="sum-note">' + (o.method === "ACH"
                ? ACH_PCT + '% capped at $' + (ACH_CAP / 100).toFixed(2)
                : CARD_PCT + '% + ' + CARD_FIXED + '\u00A2') +
              ' charged by Stripe, at cost</span></div></td>' +
              '<td class="right mono sum-amount">' + money(pf) + '</td><td></td></tr>' +
            '<tr class="sum-total"><td colspan="3" class="right"><div class="sum-label">' +
              '<span class="sum-name">Paid</span></div></td>' +
              '<td class="right mono sum-total-amount">' + money(tot) + '</td><td></td></tr></tfoot>';
        })() +
        '</table></div></div>';
    }).join("") + '</div>';
}

/* ---------- checkout ---------- */
function viewCheckout() {
  var c = client(S.user.id), it = CATALOG.filter(function (x) { return x.sku === S.cart.sku; })[0];
  var goods = it.price * S.cart.qty;
  var est = freightEstimate(goods, S.cart.qty, it.cat, c.country, "SEA");
  var waived = !!c.freightWaived;
  var charged = waived ? 0 : est.total;
  var fee = feeOn(goods + charged);
  var net = goods + charged + fee;
  var opts = [
    {key: "card", label: "Card", fee: processingFor(net, "card"),
     note: CARD_PCT + "% + " + CARD_FIXED + "\u00A2, charged by Stripe"},
    {key: "ach", label: "Bank transfer (ACH)", fee: processingFor(net, "ach"),
     note: ACH_PCT + "% capped at $" + (ACH_CAP / 100).toFixed(2) + ", charged by Stripe"}
  ].map(function (o) { o.total = net + o.fee; return o; });
  S.quote = {goods: goods, est: est, waived: waived, charged: charged, fee: fee, net: net, opts: opts};

  var freightRow = waived
    ? '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +

        '<span class="free-tag">Client ' + esc(c.name) + ' marked as free in system</span>' +

        '<span class="struck mono sum-was">' + money(est.total) + '</span>' +

    : '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
        '<span class="sum-name">Freight &amp; customs to ' + esc(est.destination) + '</span>' +
        '<span class="sum-note">' + est.mode.toLowerCase() + ' freight, ' + est.days +
        ' days transit</span></div></td>' +
      '<td class="right mono sum-amount">' + money(est.total) + '</td></tr>';

  return '<div class="shell"><aside class="sidebar">' +
    '<div class="brand" data-act="home" style="padding:.2rem .65rem .5rem"><span class="brand-mark">M</span>' +
    '<span><span class="brand-name" style="font-size:.95rem">Monti</span>' +
    '<span class="brand-sub">Member portal</span></span></div>' +
    '<div class="side-group"><button class="side-link" data-act="portal">' +
    '<span class="side-icon">←</span> Back to my portal</button></div></aside>' +
    '<div class="main"><div class="main-head"><div><div class="eyebrow">' + esc(c.name) + '</div>' +
    '<h1>Checkout</h1></div></div><div class="main-body">' +
    '<div class="grid grid-sidebar"><div class="stack">' +

      '<div class="card card-flush"><div class="card-head"><h3>What you\'re buying</h3></div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th>Item</th><th class="right">Unit</th><th class="right">Qty</th><th class="right">Line total</th>' +
        '</tr></thead><tbody><tr>' +
        '<td>' + esc(it.name) + '<div class="tiny mono dim">' + esc(it.sku) + '</div></td>' +
        '<td class="right mono tnum">' + money(it.price) + '</td>' +
        '<td class="right mono tnum">' +
          '<input type="number" id="qty" value="' + S.cart.qty + '" min="' + it.moq + '" step="1" ' +
          'style="width:110px;text-align:right"></td>' +
        '<td class="right mono tnum" id="line">' + money(goods) + '</td></tr></tbody>' +
        '<tfoot>' +
        '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
          '<span class="sum-name">Goods subtotal</span></div></td>' +
          '<td class="right mono sum-amount" id="sub">' + money(goods) + '</td></tr>' +
        freightRow +
        '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
          '<span class="sum-name">Convenience fee</span>' +
          '<span class="sum-note">' + FEE_PERCENT + '% of the order</span>' +
          '</div></td><td class="right mono sum-amount" id="fee">' + money(fee) + '</td></tr>' +
        '<tr class="sum-row"><td colspan="3" class="right"><div class="sum-label">' +
          '<span class="sum-name">Payment processing <span class="dim" id="proc-method">— card</span></span>' +
          '<span class="sum-note" id="proc-note">' + CARD_PCT + '% + ' + CARD_FIXED +
          '\u00A2 charged by Stripe, passed on at cost</span>' +
          '</div></td><td class="right mono sum-amount" id="proc">' + money(opts[0].fee) + '</td></tr>' +
        '<tr class="sum-total"><td colspan="3" class="right"><div class="sum-label">' +
          '<span class="sum-name">Total due</span>' +
          '<span class="sum-note">Everything included. Nothing added later.</span>' +
          '</div></td><td class="right mono sum-total-amount" id="total">' +
          money(opts[0].total) + '</td></tr></tfoot>' +
        '</table></div>' +
        '<details class="more" style="margin:0;border-top:1px solid var(--line)">' +
          '<summary style="padding:.85rem 1.4rem;border:0">How that freight and customs figure is worked out</summary>' +
          '<div class="more-body" style="padding:0 1.4rem 1.4rem">' +
          '<table class="data" style="border:1px solid var(--line);border-radius:var(--radius)"><tbody>' +
          est.lines.map(function (l) {

            est.chargeable.toFixed(1) + ' kg chargeable weight at the current ' + est.mode.toLowerCase() +

            'what finally governs.</p></div></details>' +
        '<div class="card-body tiny dim" style="border-top:1px solid var(--line-soft)">Minimum order ' +
          it.moq.toLocaleString("en-US") + ' units.</div></div>' +

      '<form class="card" id="pay-form"><h3>How would you like to pay?</h3>' +
        '<div class="pay-list" style="margin-top:1.25rem">' +
        opts.map(function (o, i) {
          return '<label class="pay-option">' +
            '<input type="radio" name="method" value="' + o.key + '"' + (i === 0 ? " checked" : "") +
              ' data-fee="' + o.fee + '" data-total="' + o.total + '"' +
              ' data-fee-text="' + money(o.fee) + '" data-total-text="' + money(o.total) + '"' +
              ' data-label="' + esc(o.label) + '" data-rate="' + esc(o.note) + ', passed on at cost">' +
            '<span class="pay-body">' +
              '<span class="pay-title">' + esc(o.label) +
                ' <span class="badge badge-slate badge-plain">' + money(o.total) + '</span></span>' +
              '<span class="pay-note">' +
                (o.key === "card"
                  ? "Visa, Mastercard, Amex. Funds confirm immediately, so your 24-hour manufacturer review starts the moment you pay."
                  : "Settles in 1\u20133 business days. Nothing is produced until the money actually lands.") +
                '<br><span class="dim">Processing ' + money(o.fee) + ' — ' + esc(o.note) + '.</span>' +
              '</span></span></label>';
        }).join("") + '</div>' +
        '<div class="fee-note"><span class="fee-badge">' + FEE_PERCENT + '%</span>' +
          '<span>Two lines above, and that\'s everything: our ' + FEE_PERCENT + '% convenience fee, and ' +
          'what Stripe charges to move the money, passed on at cost. No listing fee, no account fee, ' +
          'no minimum, nothing added later.</span></div>' +
        '<button class="btn btn-primary btn-xl btn-block" style="margin-top:1.25rem" type="submit" id="paybtn">' +
          'Pay ' + money(opts[0].total) + '</button>' +
        '<p class="tiny dim center" style="margin-top:.9rem">In the real site this hands you to Stripe. ' +
          'We never see your card or account number.</p>' +
      '</form></div>' +

      '<div class="stack">' +
        (waived ? '<div class="card owner-card"><span class="eyebrow-label">Owner offer</span>' +
          '<h3 style="margin-top:.7rem">Freight &amp; customs on us</h3>' +
          '<p class="tiny" style="margin-top:.6rem;color:var(--ink-2)">Client ' +
          '<strong>' + esc(c.name) + '</strong> is marked as free in the system. The ' +
          money(est.total) + ' it would cost to get ' +
          'this to ' + esc(est.destination) + ' — sea freight, handling, duty and entry fees — is absorbed ' +
          'by us on this order.</p>' +
          '<p class="tiny dim" style="margin-top:.6rem">— Owner standing offer</p></div>' : '') +
        '<div class="card" style="border-left:2px solid var(--green)">' +
          '<div class="stat-label">What happens after you pay</div>' +
          '<ol class="stack-sm" style="margin:.75rem 0 0;padding-left:1.1rem;font-size:.85rem;color:var(--ink-2)">' +
            '<li>Funds confirmed — instant on a card, on settlement for ACH.</li>' +
            '<li>A 24-hour manufacturer review. Last window to change anything.</li>' +
            '<li>Production, then freight, with a tracking code on your order.</li>' +
          '</ol></div>' +
        '<div class="card"><div class="stat-label">Shipping to</div>' +
          '<p class="tiny muted" style="margin-top:.5rem">1200 Industrial Way, Suite 400<br>' +
          esc(c.city) + ', ' + esc(c.country) + '</p></div>' +
      '</div></div></div></div></div>';
}

      '<span class="eyebrow-label">' + (ach ? "Awaiting settlement" : "Funds confirmed") + '</span>' +
      '<h2 style="margin-top:.75rem">' + money(paidTotal) + ' · ' + esc(o.name) + '</h2>' +
      '<p class="tiny dim" style="margin-top:.4rem">' + money(goods) + ' of goods' +
        (o.freightWaived ? ', freight and customs absorbed by us' : '') +

      (ach
        ? 'Your bank debit is on its way. ACH settles in 1–3 business days, and the moment the money ' +

        : 'Your order is locked in and now sits in a mandatory <strong>24-hour manufacturer review</strong>. ' +

      '<button class="btn btn-primary" style="margin-top:1.5rem" data-ptab="purchases">See it in purchased items</button>' +

}

/* --- the ledger, rendered ------------------------------------------------
   One function for both surfaces. `client` decides which columns appear — the
   client view has no fee and no net, because those are ours — and everything
   else is identical, deliberately: two renderers would drift, and what they
   would drift about is money. */
function ledgerDelta(v) {
  if (v === null || v === undefined) return '<span class="delta flat">no prior period</span>';
  if (v > 0.005) return '<span class="delta up">▲ ' + (v * 100).toFixed(1) + '%</span>';
  if (v < -0.005) return '<span class="delta down">▼ ' + (-v * 100).toFixed(1) + '%</span>';
  return '<span class="delta flat">level</span>';
}

function ledgerPeriodSwitch() {
  return '<div class="ledger-periods" role="group" aria-label="Period format">' +
    [["month", "Month over month"], ["quarter", "Quarter over quarter"],
     ["year", "Year over year"]].map(function (p) {
      return '<button class="ledger-period-btn ' + (S.ledgerPeriod === p[0] ? "active" : "") +
        '" aria-pressed="' + (S.ledgerPeriod === p[0]) + '" data-lperiod="' + p[0] + '">' +
        p[1] + '</button>';
    }).join("") + '</div>';
}

function ledgerPeriodTable(view, isClient) {
  if (!view.periods.length) {
    return '<div class="empty" style="padding:2.5rem 1rem">No transactions in this range.</div>';
  }
  return '<div class="ledger-grand">' +
      '<div><div class="stat-label">Total over this range</div>' +
      '<div class="stat-value">' + money(view.grand.gross) + '</div>' +
      '<div class="tiny dim">' + view.grand.orders + ' order' +
        (view.grand.orders === 1 ? "" : "s") + ' · ' + view.periods.length + ' ' +
        view.granularity + (view.periods.length === 1 ? "" : "s") + '</div></div>' +
      /* §11.4.3 — a pending debit sits apart from the total it is deliberately
         not in. In the same column it would read as revenue. */
      (view.grand.pending ? '<div class="ledger-pending">' +
        '<div class="stat-label">Pending, not counted</div>' +
        '<div class="stat-value">' + money(view.grand.pending) + '</div>' +
        '<div class="tiny dim">Bank transfers still settling.</div></div>' : '') +
    '</div>' +
    '<div class="table-wrap"><table class="data ledger-table"><thead><tr>' +
      '<th>' + view.granularity.charAt(0).toUpperCase() + view.granularity.slice(1) + '</th>' +
      '<th class="right">Gross</th>' +
      (isClient ? '' : '<th class="right">Fees</th>') +
      '<th class="right">' + (isClient ? "Paid" : "Net") + '</th>' +
      '<th class="right">Orders</th><th class="right">Average</th><th>vs previous</th>' +
    '</tr></thead><tbody>' + view.periods.map(function (p) {
      return '<tr><td><strong>' + esc(p.label) + '</strong></td>' +
        '<td class="right mono tnum">' + money(p.totals.gross) + '</td>' +
        (isClient ? '' : '<td class="right mono tnum">' + money(p.totals.fees) + '</td>') +
        '<td class="right mono tnum">' + money(p.totals.net) + '</td>' +
        '<td class="right tnum">' + p.totals.orders + '</td>' +
        '<td class="right mono tnum">' + money(p.totals.aov) + '</td>' +
        '<td class="tiny">' + ledgerDelta(p.delta) + '</td></tr>';
    }).join("") + '</tbody></table></div>';
}

function ledgerTransactions(rows, isClient) {
  if (!rows.length) {
    return '<div class="empty" style="padding:2.5rem 1rem">' +
      '<p>Nothing matches this search.</p>' +
      '<p class="tiny dim">Try a wider date range, or clear the filters.</p></div>';
  }
  return '<div class="table-wrap"><table class="data ledger-table"><thead><tr>' +
    '<th>Receipt</th><th>When</th>' + (isClient ? '' : '<th>Member</th>') +
    '<th>Order</th><th>Event</th><th>Method</th><th class="right">Amount</th>' +
    (isClient ? '' : '<th class="right">Fee</th>') + '<th></th>' +
    '</tr></thead><tbody>' + rows.map(function (r) {
      var tone = r.status === "SETTLED" ? "green" : (r.status === "PENDING" ? "amber" : "red");
      return '<tr><td class="mono tiny">' + esc(r.receipt) + '</td>' +
        '<td class="tiny">' + esc(fmtFull(r.when)) + '</td>' +
        (isClient ? '' : '<td>' + esc(client(r.clientId) ? client(r.clientId).name : "—") + '</td>') +
        '<td class="mono tiny">' + esc(r.orderRef || "—") + '</td>' +
        '<td><span class="badge badge-' + tone + '">' + esc(r.kind.toLowerCase()) + '</span>' +
          (r.status === "PENDING"
            ? '<div class="tiny dim">settling — not counted as revenue</div>' : '') + '</td>' +
        '<td class="tiny">' + esc((r.method || "—").toLowerCase()) + '</td>' +
        '<td class="right mono tnum">' + money(r.gross) + '</td>' +
        (isClient ? '' : '<td class="right mono tnum">' + money(r.fee) + '</td>') +
        '<td class="right"><button class="btn btn-sm" data-receipt="' + esc(r.receipt) +
          '">Receipt</button></td></tr>';
    }).join("") + '</tbody></table></div>';
}

function ledgerSearchForm() {
  var f = S.ledgerFilters;
  return '<div class="ledger-search">' +
    '<label class="field"><span class="field-label">From</span>' +
      '<input type="date" id="lf-start" value="' + esc(f.start || "") + '"></label>' +
    '<label class="field"><span class="field-label">To</span>' +
      '<input type="date" id="lf-end" value="' + esc(f.end || "") + '"></label>' +
    (S.user && S.user.kind === "admin"
      ? '<label class="field"><span class="field-label">Member</span>' +
        '<input type="text" id="lf-member" value="' + esc(f.member || "") + '" ' +
        'placeholder="Company name"></label>' : '') +
    '<label class="field"><span class="field-label">Order</span>' +
      '<input type="text" id="lf-order" value="' + esc(f.orderRef || "") + '" ' +
      'placeholder="MMI-O-…"></label>' +
    '<label class="field"><span class="field-label">Receipt</span>' +
      '<input type="text" id="lf-receipt" value="' + esc(f.receipt || "") + '" ' +
      'placeholder="MMI-R-…"></label>' +
    '<div class="ledger-search-actions">' +
      '<button class="btn btn-primary" data-lsearch="1">Search</button>' +
      '<button class="btn" data-lclear="1">Clear</button></div></div>';
}

function ledgerFilterOpts(clientId) {
  var f = S.ledgerFilters;
  return {
    clientId: clientId || null,
    start: f.start ? new Date(f.start + "T00:00:00") : null,
    end: f.end ? new Date(f.end + "T00:00:00") : null,
    member: f.member || null, orderRef: f.orderRef || null, receipt: f.receipt || null
  };
}

function ledgerBody(clientId) {
  var isClient = !!clientId;
  var opts = ledgerFilterOpts(clientId);
  var view = ledgerPeriods(S.ledgerPeriod, opts);
  var rows = ledgerRows(opts);
  return ledgerSearchForm() + ledgerPeriodSwitch() +
    ledgerPeriodTable(view, isClient) +
    '<div class="divider-label">Transactions</div>' +
    ledgerTransactions(rows, isClient);
}

function viewReceipt() {
  var r = LEDGER.filter(function (x) { return x.receipt === S.receipt; })[0];
  var isAdmin = S.user && S.user.kind === "admin";
  /* Scoped in the lookup rather than checked afterwards: a member asking for
     another member's receipt number finds nothing, because it was never
     selectable (§11.6). */
  if (r && !isAdmin && r.clientId !== S.user.id) r = null;
  var back = isAdmin ? "admin" : "portal";
  if (!r) {
    return '<div class="card" style="margin:2rem auto;max-width:520px">' +
      '<h3>No such receipt</h3>' +
      '<p class="muted" style="margin-top:.6rem">That receipt number does not belong to ' +
      'this account.</p>' +
      '<button class="btn btn-primary" style="margin-top:1rem" data-act="' + back + '">Back</button></div>';
  }
  return '<div class="card card-lg" style="margin:2rem auto;max-width:560px">' +
    '<span class="eyebrow-label">Receipt</span>' +
    '<h2 style="margin-top:.6rem">' + esc(r.receipt) + '</h2>' +
    '<dl class="kv" style="margin-top:1.25rem">' +
      (isAdmin ? '<dt>Member</dt><dd>' + esc(client(r.clientId).name) + '</dd>' : '') +
      '<dt>When</dt><dd>' + esc(fmtFull(r.when)) + '</dd>' +
      '<dt>Item</dt><dd>' + esc(r.itemName || "—") + '</dd>' +
      '<dt>Order</dt><dd class="mono">' + esc(r.orderRef || "—") + '</dd>' +
      '<dt>Event</dt><dd>' + esc(r.kind.toLowerCase()) + ' · ' + esc(r.status.toLowerCase()) + '</dd>' +
      '<dt>Method</dt><dd>' + esc((r.method || "—").toLowerCase()) + '</dd>' +
      '<dt>Amount</dt><dd class="mono tnum">' + money(r.gross) + '</dd>' +
      (isAdmin ? '<dt>Fee</dt><dd class="mono tnum">' + money(r.fee) + '</dd>' : '') +
    '</dl>' +
    (r.status === "PENDING"
      ? '<div class="notice notice-wait" style="margin-top:1rem"><strong>Still settling.</strong>' +
        'Bank transfers take one to three business days. Nothing is produced until the money ' +
        'actually lands.</div>' : '') +
    '<button class="btn btn-primary" style="margin-top:1.5rem" data-act="' + back + '">Back to the ledger</button>' +
  '</div>';
}

/* --- the Decision Room, rendered ---------------------------------------- */
function drRailRow(it) {
  var sub = it.status === "approved"
    ? "priced " + esc(fmtFull(it.publishedAt))
    : DR_STAGES[it.stage - 1];
  return '<li><button class="itembtn' + (it.ref === S.drRef ? " on" : "") +
    '" data-dr="' + esc(it.ref) + '">' +
    '<span class="iref mono">' + esc(it.ref) + '</span>' +
    '<span class="iname' + (it.name ? "" : " unnamed") + '">' + esc(drTitle(it)) + '</span>' +
    '<em>' + esc(sub) + '</em></button></li>';
}

function drNameField(it) {
  return '<div class="namefield">' +
    '<label class="field-label" for="drnm">Your name for it</label>' +
    '<input id="drnm" type="text" value="' + esc(it.name) + '" placeholder="' + esc(it.auto) + '">' +
    '<span class="tiny dim">Ref <span class="mono">' + esc(it.ref) + '</span> never changes.</span>' +
    '</div>';
}

function drPendingPane(it) {
  return '<div class="card card-lg">' +
    '<span class="eyebrow-label">Awaiting approval · <span class="mono">' + esc(it.ref) + '</span></span>' +
    '<h2 style="margin-top:.6rem">' + esc(drTitle(it)) + '</h2>' +
    '<p class="muted" style="margin-top:.7rem;max-width:62ch">No prices yet. An item gets ' +
      'its Decision Room the moment a manufacturing engineer signs the specification and ' +
      'the pricing desk publishes the strategies.</p>' +
    drNameField(it) +
    '<ol class="dr-tracker">' + DR_STAGES.map(function (s, i) {
      var cls = i + 1 < it.stage ? "done" : (i + 1 === it.stage ? "now" : "");
      return '<li class="' + cls + '"><span class="tk">' + (i + 1) + '</span><strong>' +
        esc(s) + '</strong></li>';
    }).join("") + '</ol>' +
    '<dl class="kv" style="margin-top:1.5rem"><dt>What you sent</dt><dd>' + esc(it.source) + '</dd></dl>' +
    /* A real outstanding question, not filler — this is the board-grade
       escalation Appendix B says to file rather than guess. */
    '<div class="notice notice-wait" style="margin-top:1.25rem">' +
      '<strong>What we still need</strong>' + esc(it.outstanding) + '</div>' +
    '<div class="lockedroom"><span class="tag tag-muted">Locked</span>' +
      '<span class="tiny dim">Three strategies, the quantity slider and the target-price ' +
      'tools unlock here on approval.</span></div></div>';
}

function drPricedPane(it) {
  var v = it.view;
  var cards = it.strats.map(function (s) {
    var c = drStrategyView(it, s, v.qty, v.mode, v.treatment);
    var hits = v.target && c.landed <= v.target;
    return '<article class="card strat' + (hits ? " hits" : "") + '">' +
      '<header><span class="tag">' + esc(c.label) + '</span><h3>' + esc(c.title) + '</h3></header>' +
      '<div class="strat-price"><span class="stat-label">Landed per unit</span>' +
        '<p class="strat-big">' + cents4(c.landed) + '</p>' +
        '<p class="tiny dim mono">' + cents4(c.ex) + ' ex-works · ' + cents4(c.freight) +
        ' freight · ' + cents4(c.duty) + ' duty</p></div>' +
      '<dl class="strat-specs">' +
        '<div><dt>Lead time</dt><dd>' + c.lead + ' days</dd></div>' +
        '<div><dt>Route</dt><dd>' + esc(c.mode) + '</dd></div>' +
        '<div><dt>Production</dt><dd>' + esc(c.prod) + '</dd></div>' +
        '<div><dt>Inspection</dt><dd>' + esc(c.inspect) + '</dd></div>' +
        '<div><dt>Order total</dt><dd>' + money(Math.round(c.total)) + '</dd></div></dl>' +
      '<footer><button class="btn btn-sm" data-drbuy="' + c.slot + '">Buy this route</button>' +
        '<span class="tiny dim">' + esc(c.foot) + '</span></footer></article>';
  }).join("");

  var levers = drLeverRows(it).map(function (l) {
    return '<label class="lever"><input type="checkbox" data-drlever="' + esc(l.kind) + '"' +
      (v.levers[l.kind] ? " checked" : "") + '>' +
      '<span><strong>' + esc(l.label) + '</strong><em>' + esc(l.note) + '</em></span>' +
      '<span class="delta mono">−' + cents4(l.saving) + '</span></label>';
  }).join("");

  var base = drLanded(it.costs, v.qty, v.mode, {amortize: drBaseline(it) === "amortized"});
  var eng = drEngineered(it);
  var picked = Object.keys(v.levers).filter(function (k) { return v.levers[k]; });
  var hit = v.target && eng.landed !== null && eng.landed <= v.target;

  return drNameField(it) +
    /* The Decision Room is what a priced product opens into, and it is worth
       naming here: below this line the page stops describing the product and
       starts pricing it three different ways. */
    '<div class="roomhead"><span class="eyebrow-label">Decision Room</span>' +
    '<p class="tiny dim">Three ways to buy the same part. Move the quantity, change the ' +
    'route, and every figure below re-prices from what the desk actually entered.</p></div>' +
    '<div class="dr-controls">' +
      '<div class="dr-control"><span class="stat-label">Order quantity</span>' +
        '<output class="dr-qty" id="drQty">' + num(v.qty) + '</output>' +
        /* Bounds are data, never a constant: at $0.14 a container a fixed
           1,000–10,000 would be a $140 order. */
        '<input type="range" id="drQtyRange" min="' + it.qtyMin + '" max="' + it.qtyMax +
          '" step="' + it.qtyStep + '" value="' + v.qty + '" aria-label="Order quantity">' +
        '<div class="rangeticks"><span>' + num(it.qtyMin) + '</span><span>' + num(it.qtyMax) +
          '</span></div>' +
        '<p class="tiny dim">Priced from the published quantity band.</p></div>' +
      '<label class="field"><span class="field-label">Target unit price</span>' +
        '<input type="text" id="drTarget" value="' + (v.target / 100).toFixed(4) + '"></label>' +
      '<div class="dr-control"><span class="stat-label">Freight</span><div class="seg">' +
        ["ocean", "split", "air"].map(function (m) {
          return '<button data-drmode="' + m + '" class="' + (v.mode === m ? "on" : "") + '">' +
            m.charAt(0).toUpperCase() + m.slice(1) + '</button>';
        }).join("") + '</div></div>' +
      /* The three routes carry different tooling defaults (§11.3.3), so the
         first option is to leave them alone. Forcing one on all three by
         default erases the difference the section exists to express. */
      '<div class="dr-control"><span class="stat-label">Tooling · ' + money(it.costs.tooling) +
        '</span><div class="seg">' +
        '<button data-drtool="" class="' + (!v.treatment ? "on" : "") +
          '">As each route prices it</button>' +
        '<button data-drtool="amortized" class="' + (v.treatment === "amortized" ? "on" : "") +
          '">Amortise</button>' +
        '<button data-drtool="upfront" class="' + (v.treatment === "upfront" ? "on" : "") +
          '">Pay upfront</button></div>' +
        '<p class="tiny dim">' + (!v.treatment
          ? "Each route prices the tool the way that route works — the cheapest one spreads it, the other two charge it upfront so the unit price stays clean."
          : v.treatment === "amortized"
            ? "Spread across this run — adds " + cents4(it.costs.tooling / v.qty) + " per unit at this quantity. The tool remains your property."
            : "Invoiced once at " + money(it.costs.tooling) + ", before the run.") + '</p></div>' +
    '</div>' +
    '<div class="strategies">' + cards + '</div>' +
    '<div class="card card-lg wwntc">' +
      '<span class="eyebrow-label">What would need to change?</span>' +
      '<h3 style="margin-top:.6rem">Engineering the economics toward your target</h3>' +
      '<div class="gap-read">' +
        '<div><span class="stat-label">Your target</span><p class="stat-value">' +
          cents4(v.target) + '</p></div>' +
        '<div><span class="stat-label">Best today</span><p class="stat-value">' +
          cents4(base.landed) + '</p></div>' +
        '<div><span class="stat-label">Gap</span><p class="stat-value" style="color:' +
          (base.landed > v.target ? "var(--stop)" : "var(--good)") + '">' +
          (base.landed > v.target ? "+" : "−") + cents4(Math.abs(base.landed - v.target)) +
          '</p></div></div>' +
      '<div class="levers">' + levers + '</div>' +
      '<div class="outcome ' + (hit ? "hit" : "miss") + '">' +
        '<div><span class="stat-label">Engineered price</span><p class="stat-value">' +
          cents4(eng.landed) + '</p></div>' +
        '<div style="flex:1;min-width:220px">' + (!picked.length
          ? "Tick a change above and we will price it."
          : hit
            ? "<strong>On target.</strong> " +
              money(Math.round((base.landed - eng.landed) * eng.qty)) +
              " saved against the current specification at " + num(eng.qty) + " units."
            /* Never silence on an unreachable target. */
            : "<strong>Still short of your target.</strong> These changes reach " +
              cents4(eng.landed) + ". Raising the quantity toward " + num(it.qtyMax) +
              " is the largest lever left inside what we have priced; beyond that we " +
              "would need to re-quote rather than guess.") +
        '</div></div></div>' +
    '<div class="card card-lg" style="margin-top:1.25rem">' +
      '<span class="eyebrow-label">Freight at ' + num(v.qty) + ' units</span>' +
      '<h3 style="margin-top:.6rem">Every route we have a rate for</h3>' +
      '<div class="table-wrap" style="margin-top:1rem"><table class="data"><thead><tr>' +
        '<th>Route</th><th>Transit</th><th class="right">Freight / unit</th>' +
        '<th class="right">Freight total</th><th class="right">Landed / unit</th>' +
      '</tr></thead><tbody>' + ["ocean", "split", "air"].map(function (m) {
        var f = drLanded(it.costs, v.qty, m, {amortize: drBaseline(it) === "amortized"});
        return '<tr><td>' + esc(FREIGHT_LANES[m].lane) +
          (m === v.mode ? ' <span class="tag tag-green">selected</span>' : '') + '</td>' +
          '<td class="tiny">' + esc(FREIGHT_LANES[m].transit) + '</td>' +
          '<td class="right mono tnum">' + cents4(f.freight) + '</td>' +
          '<td class="right mono tnum">' + money(Math.round(f.freight * v.qty)) + '</td>' +
          '<td class="right mono tnum">' + cents4(f.landed) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<p class="tiny dim" style="margin-top:.75rem">Every figure here is an estimate built ' +
      'from a lane rate we entered, not a booked rate. Duty is applied to the ex-works ' +
      'value, which is how a customs entry computes it.</p></div>';
}

var INTAKE_FORMATS = [
  ["Voice note", "A transcript, then a structured feature list you confirm. Most members do this from the floor."],
  ["Phone video", "We pull still frames, identify construction, and mark what we still need to see."],
  ["Sketch", "We redraw it to scale and send it back with the assumptions we made highlighted."],
  ["Photo with something for scale", "Put a coin, a ruler or a caliper in frame and we can scale the whole part from it."],
  ["A competitor's listing", "We treat the listing as a requirements document, not a target to copy."],
  ["Your current supplier's quote", "We normalise it into a true landed cost and show you every line it left out."],
  ["CAD or a drawing", "STEP, IGES, DXF or PDF go straight to a manufacturability review."],
  ["The thing itself", "Ask for a Make This Box. Prepaid, tamper-evident, and tracked from the moment it leaves your hands."]
];
var INTAKE_WEIGHTS = [
  [1, "A change to something we already make for you"],
  [2, "A new product — one part, one process"],
  [4, "A complex assembly — several parts, tooling, or sub-suppliers"]
];

/* The intake door. Accepts whatever the member already has, says what happens to
   each kind of thing, and creates an unapproved item — never a price. A named
   engineer signs the specification first, which is why the item lands at stage 1
   rather than coming back with a number. */
function viewIntake() {
  var cap = CAPACITY;
  return '<p class="section-lede" style="max-width:60ch">Send a sketch, a photograph, ' +
    'a voice note, a competitor\'s listing, your current supplier\'s quote, or a CAD ' +
    'file. We structure the rest into a manufacturable specification — and a person ' +
    'signs it before it becomes a price.</p>' +
    '<div class="dimrule" style="margin:1.75rem 0 1.5rem"><i></i></div>' +
    '<div class="grid grid-sidebar"><div class="card card-lg" style="display:grid;gap:1.5rem">' +
      '<div><span class="eyebrow">What you already have</span>' +
        '<div class="chips" style="margin-top:.7rem">' + INTAKE_FORMATS.map(function (f, i) {
          return '<button class="chip" type="button" data-inote="' + esc(f[1]) + '" ' +
            'aria-pressed="' + (i === 0) + '">' + esc(f[0]) + '</button>';
        }).join("") + '</div>' +
        '<p class="note-line" id="chipNote"><span class="mono">&rarr;</span> ' +
          esc(INTAKE_FORMATS[0][1]) + '</p></div>' +
      '<div class="dimrule"><i></i></div>' +
      '<div><span class="eyebrow">Rough answers are fine</span>' +
        '<div class="qgrid" style="margin-top:.8rem">' +
          '<label>What does it need to do?<input type="text" id="inSummary" ' +
            'placeholder="Hold a takeaway meal without going soft"></label>' +
          '<label>Roughly how many?<input type="text" placeholder="A few hundred thousand a year"></label>' +
          '<label>Made of what? A guess is fine<input type="text" placeholder="Board of some kind"></label>' +
          '<label>When do you need it?<input type="text" placeholder="Before the summer menu"></label>' +
        '</div></div>' +
      '<div><span class="eyebrow">How much engineering is this, roughly?</span>' +
        '<div class="weightpick" style="margin-top:.8rem">' + INTAKE_WEIGHTS.map(function (w) {
          return '<label class="pay-option"><input type="radio" name="inw" value="' + w[0] + '"' +
            (w[0] === 2 ? " checked" : "") + '><span><span class="pay-title">' + esc(w[1]) +
            ' <span class="tag">' + w[0] + ' unit' + (w[0] === 1 ? "" : "s") + '</span></span>' +
            '<span class="pay-note">If we decline it, or send it back for missing ' +
            'information, you are not charged.</span></span></label>';
        }).join("") + '</div></div>' +
      '<div class="row wrap" style="gap:.75rem">' +
        '<button class="btn btn-primary" data-intake="1">Send it to engineering</button>' +
        '<span class="tiny dim">A structured draft comes back within 24 hours.</span></div>' +

        'reaches a price without a human approval on the record.</p></div>' +

function stat(label, value, sub, accent) {
  return '<div class="stat' + (accent ? " stat-accent" : "") + '"><div class="stat-label">' + esc(label) + '</div>' +
    '<div class="stat-value">' + esc(value) + '</div>' +
    (sub ? '<div class="stat-sub">' + esc(sub) + '</div>' : '') + '</div>';
}
function quoteTable(list) {
  if (!list.length) {
    return '<div class="empty">You have not asked us for anything yet. The form above is ' +
      'the only door — there is no second place to fill in.</div>';
  }
  /* The product column is the merge, made visible: a request opens a product at
     the same moment, and the row links to it. A request from before the merge
     has none, and says so rather than linking to nothing. */
  return '<div class="table-wrap"><table class="data"><thead><tr>' +
    '<th>Request</th><th>What you asked for</th><th>Product</th><th>Quantity</th><th>Sent</th>' +
    '<th>Status</th><th class="right">Estimate</th>' +
    '</tr></thead><tbody>' + list.map(function (q) {
      return '<tr><td class="mono tiny">' + esc(q.ref) + '</td>' +
        '<td>' + esc(q.title) + '</td>' +
        '<td class="mono tiny">' + (q.itemRef
          ? '<a class="cell-link" style="cursor:pointer" data-dr="' + esc(q.itemRef) + '">' +
            esc(q.itemRef) + '</a>'
          : '<span class="dim">—</span>') + '</td>' +
        '<td class="muted tnum">' + (q.qty ? q.qty.toLocaleString("en-US") : "—") + '</td>' +
        '<td class="tiny dim">' + esc(fmtFull(q.created)) + '</td>' +
        '<td>' + statusBadge(q.status) + '</td>' +
        '<td class="right mono tnum">' + (q.total ? money(q.total) : "—") + '</td></tr>';

function viewAdmin() {
  var nav = [["revenue","◈","Revenue"],["ledger","≡","Master ledger"],
             ["incoming","▼","Incoming quotes"],["crm","◎","CRM"],
             ["catalog","▤","Items catalog"],["clients","▣","Client portals"]];
  var openQuotes = QUOTES.concat(S.submitted).filter(function(q){return q.status==="NEW"||q.status==="IN_REVIEW";}).length;

  var side = '<aside class="sidebar">' +
    '<div class="brand" data-act="home" style="padding:.2rem .65rem .5rem"><span class="brand-mark">M</span>' +
      '<span><span class="brand-name" style="font-size:.95rem">Monti</span>' +
      '<span class="brand-sub">Admin portal</span></span></div>' +
    '<div class="side-group"><div class="side-title">Overview</div>' +
      nav.map(function (n) {
        var count = n[0] === "crm" ? CLIENTS.length
                  : n[0] === "catalog" ? CATALOG.length
                  : n[0] === "incoming" ? incomingQuotes().length : null;
        return '<button class="side-link ' + (S.adminTab === n[0] && !S.adminClient ? "active" : "") + '" data-atab="' + n[0] + '">' +
          '<span class="side-icon">' + n[1] + '</span> ' + n[2] +
          (count ? '<span class="side-count">' + count + '</span>' : "") + '</button>';
      }).join("") + '</div>' +
    '<div class="side-group"><div class="side-title">Open client portals</div>' +
      CLIENTS.map(function (c) {
        return '<button class="side-link" data-openclient="' + c.id + '">' +
          '<span class="side-icon">→</span> ' + esc(c.name) + '</button>';
      }).join("") + '</div>' +
    '<div class="side-foot"><div class="row" style="padding:.4rem .65rem">' +
      '<div class="avatar avatar-accent">TM</div><div style="min-width:0">' +
      '<div style="font-size:.84rem;font-weight:500">Tyler Monti</div>' +
      '<div class="tiny dim">Tyler1 · admin</div></div></div>' +
      '<div class="side-group" style="margin-top:.45rem">' +
      '<button class="side-link" data-act="home"><span class="side-icon">◱</span> Public site</button>' +
      '<button class="side-link" data-act="logout"><span class="side-icon">→</span> Sign out</button></div></div>' +
    '</aside>';

  var body, head;
  if (S.adminClient) { head = adminClientHead(); body = adminClientBody(); }
  else if (S.adminTab === "revenue") { head = ["Money", "Revenue"]; body = adminRevenue(); }
  else if (S.adminTab === "ledger")  { head = ["Money", "Master ledger"]; body = ledgerBody(null); }
  else if (S.adminTab === "incoming") { head = ["Triage", "Incoming quotes"]; body = adminIncoming(); }
  else if (S.adminTab === "crm")     { head = ["Relationships", "CRM · " + CLIENTS.length + " clients"]; body = adminCrm(); }
  else if (S.adminTab === "catalog") { head = ["Product", "Items catalog"]; body = adminCatalog(); }
  else                                { head = ["Access", "Client portals"]; body = adminClients(); }

  return '<div class="shell">' + side + '<div class="main">' +
    '<div class="main-head"><div><div class="eyebrow">' + esc(head[0]) + '</div><h1>' + esc(head[1]) + '</h1></div>' +
    '<div class="row"><span class="badge badge-slate">' + openQuotes + ' quotes on the clock</span></div></div>' +
    '<div class="main-body">' + body + '</div></div></div>';
}

function incomingQuotes() {
  return QUOTES.concat(S.submitted)
    .filter(function (q) { return q.status === "NEW"; })
    .sort(function (a, b) { return a.created - b.created; });
}

function adminIncoming() {
  var list = incomingQuotes();
  var decided = QUOTES.concat(S.submitted).filter(function (q) { return q.triaged; })
    .sort(function (a, b) { return b.triaged - a.triaged; });

  var body = list.length ? '<div class="stack">' + list.map(function (q) {
    var c = client(q.clientId);
    var due = new Date(q.created.getTime() + 24 * 3600 * 1000);
    var hoursLeft = Math.round((due - TODAY) / 36000) / 100;
    var late = hoursLeft < 0, urgent = !late && hoursLeft < 6;
    return '<div class="card card-flush"' + (urgent || late ? ' style="border-left:2px solid var(--green)"' : '') + '>' +
      '<div class="card-head"><div class="row wrap" style="gap:.75rem">' +
        '<span class="mono tiny">' + esc(q.ref) + '</span>' +
        '<span class="cell-link" data-client="' + c.id + '" style="font-weight:500">' + esc(c.name) + '</span>' +
        '<span class="badge badge-green">Member</span>' +
        '<span class="chip tiny">' + quotesFor(c.id).length + ' requests to date</span></div>' +
        '<div class="right"><div class="mono" style="font-weight:600;font-size:.9rem;color:' +
          (late ? "var(--stop)" : urgent ? "var(--wait)" : "var(--ink-2)") + '">' +
          (late ? Math.abs(hoursLeft).toFixed(1) + "h over" : hoursLeft.toFixed(1) + "h left") + '</div>' +
        '<div class="tiny dim">arrived ' + esc(fmtFull(q.created)) + '</div></div></div>' +
      '<div class="card-body"><div class="grid grid-sidebar" style="gap:1.5rem">' +
        '<div><h3>' + esc(q.title) + '</h3>' +
          '<p class="muted" style="margin-top:.6rem;font-size:.92rem">' +
          esc("Submitted through the portal. " + (q.qty ? q.qty.toLocaleString("en-US") + " units. " : "") +
              "Full spec and any files are attached to the request.") + '</p>' +
          '<dl class="kv" style="margin-top:1.25rem;grid-template-columns:130px minmax(0,1fr);font-size:.85rem">' +
          (q.qty ? '<dt>Quantity</dt><dd class="tnum">' + q.qty.toLocaleString("en-US") + '</dd>' : '') +
          '<dt>Account</dt><dd>' + esc(c.contact) + ' · ' + esc(c.email) + '</dd>' +
          '<dt>Cycle</dt><dd class="tnum">' + cycleUsed(c.id) + ' of ' + c.quoteLimit + ' used</dd>' +
          '</dl></div>' +
        '<div class="stack">' +
          '<button class="btn btn-primary btn-block" data-triage="accept:' + q.ref + '">Accept &amp; price it</button>' +
          '<div class="card" style="background:var(--surface-2)">' +
            '<span class="field-label">Decline this request</span>' +
            '<textarea rows="3" data-reason="' + q.ref + '" ' +
              'placeholder="Written for the client to read — e.g. below our practical minimum for this process."></textarea>' +
            '<button class="btn btn-block" style="margin-top:.6rem;border-color:color-mix(in srgb,var(--stop) 40%,transparent);color:var(--stop)" ' +
              'data-triage="reject:' + q.ref + '">Decline &amp; tell them</button>' +
          '</div></div>' +
      '</div></div></div>';
  }).join("") + '</div>'
  : '<div class="card empty"><div class="empty-icon">◷</div>Nothing waiting. Every request that has ' +
    'come in has been accepted or declined.</div>';

  if (decided.length) {
    body += '<div class="card card-flush" style="margin-top:2rem">' +
      '<div class="card-head"><h3>Recently triaged</h3></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th>Ref</th><th>Client</th><th>Project</th><th>Decision</th></tr></thead><tbody>' +
      decided.slice(0, 8).map(function (q) {
        var isRej = q.status === "REJECTED";
        return '<tr><td class="mono tiny">' + esc(q.ref) + '</td>' +
          '<td>' + esc(client(q.clientId).name) + '</td>' +
          '<td class="muted">' + esc(q.title) + '</td>' +
          '<td><span class="badge badge-' + (isRej ? "red" : "blue") + '">' +
            (isRej ? "We declined" : "Pricing") + '</span>' +
            (q.reason ? '<div class="tiny dim">' + esc(q.reason) + '</div>' : '') + '</td></tr>';
      }).join("") + '</tbody></table></div></div>';
  }
  return '<p class="muted" style="margin-bottom:1.5rem;max-width:64ch;font-size:.95rem">' +
    'Everything that has just landed, oldest first. Accept it and it moves into the pricing queue with ' +
    'the 24-hour clock still running. Decline it and the client is told why — nothing sits here silently.' +
    '</p>' + body;
}

function adminRevenue() {
  var t = totalsFor(S.range);
  var r = RANGES.filter(function(x){return x.key===S.range;})[0];
  var label = r.key === "1d" ? "today" : "last " + r.days + " days";
  var spark = DAYS.slice(DAYS.length - 30).map(function(d){return d.cents;});

  return '<div class="row-between wrap" style="margin-bottom:1.5rem;gap:1rem">' +
      '<div><div class="stat-label">Revenue · ' + esc(label) + '</div>' +
      '<div style="font-size:2.6rem;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin-top:.35rem" class="tnum">' +
        money(t.revenue) + '</div>' +
      '<div style="margin-top:.4rem">' + deltaHtml(t.revenueDelta) + '</div></div>' +
      '<div class="range-row" role="group" aria-label="Time period">' +
        RANGES.map(function (x) {
          return '<button class="range-btn ' + (S.range === x.key ? "active" : "") + '" data-range="' + x.key + '" ' +
            'aria-pressed="' + (S.range === x.key) + '">' + x.label + '</button>';
        }).join("") + '</div>' +
    '</div>' +

    '<div class="card" style="padding:1.5rem 1.5rem 1rem"><div id="chart"></div>' +
      '<div class="row-between wrap tiny dim" style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--line-soft)">' +
        '<span>' + (r.key === "1d" ? "Hour by hour, today" : "Daily revenue, " + esc(label)) + '</span>' +
        '<span>Hover the chart for any single ' + (r.key === "1d" ? "hour" : "day") + '</span>' +
      '</div></div>' +

    '<div class="grid grid-4" style="margin-top:1.5rem">' +
      stat("Orders", t.orders.toLocaleString("en-US"), (t.ordersDelta==null?"":""), false).replace('</div></div>',
        '</div><div class="stat-sub">' + deltaHtml(t.ordersDelta) + '</div></div>') +
      stat("Average order", money(t.aov), "across " + t.orders + " orders") +
      stat("Best day", t.bestDay ? money(t.bestDay.cents) : "—", t.bestDay ? fmtFull(t.bestDay.date) : "") +
      stat("Daily average", money(Math.round(t.revenue / Math.max(1, t.days))), "over " + t.days + " day" + (t.days===1?"":"s")) +
    '</div>' +

    '<div class="grid grid-sidebar" style="margin-top:1.5rem">' +
      '<div class="card card-flush"><div class="card-head"><h3>Revenue by client · ' + esc(label) + '</h3></div>' +
        revenueByClient(t) + '</div>' +
      '<div class="stack">' +
        '<div class="card"><div class="stat-label">Last 30 days</div>' +
          '<div style="margin-top:.75rem">' + sparkline(spark) + '</div>' +
          '<div class="tiny dim" style="margin-top:.5rem">' + money(spark.reduce(function(a,b){return a+b;},0)) + ' across 30 days</div></div>' +
        '<div class="card"><div class="stat-label">How this is counted</div>' +
          '<p class="tiny muted" style="margin-top:.6rem">Revenue books on the day funds are <strong>confirmed</strong>, ' +
          'not when the order is placed. An ACH debit still settling isn\'t in these numbers.</p></div>' +
      '</div></div>';
}

function revenueByClient(t) {
  var share = [0.31, 0.24, 0.18, 0.16, 0.11];
  var rows = CLIENTS.map(function (c, i) {
    var rev = Math.round(t.revenue * share[i]);
    var ord = Math.round(t.orders * share[i]);
    return {c: c, rev: rev, ord: ord, pct: share[i]};
  });
  var max = Math.max.apply(null, rows.map(function(r){return r.rev;})) || 1;
  return '<div class="table-wrap"><table class="data"><thead><tr>' +
    '<th>Client</th><th>Share</th><th class="right">Orders</th><th class="right">Revenue</th><th></th>' +
    '</tr></thead><tbody>' + rows.map(function (r) {
      return '<tr><td><span class="cell-link" data-openclient="' + r.c.id + '">' + esc(r.c.name) + '</span>' +
        '<div class="tiny mono dim">' + esc(r.c.ref) + '</div></td>' +
        '<td style="min-width:120px"><div style="height:5px;border-radius:100px;background:var(--sunk);overflow:hidden">' +
          '<span style="display:block;height:100%;width:' + (r.rev/max*100).toFixed(0) + '%;background:var(--chart)"></span></div>' +
          '<div class="tiny dim" style="margin-top:.3rem">' + (r.pct*100).toFixed(0) + '%</div></td>' +
        '<td class="right tnum">' + r.ord + '</td>' +
        '<td class="right mono tnum" style="font-weight:500">' + money(r.rev) + '</td>' +
        '<td class="right"><button class="btn btn-sm" data-openclient="' + r.c.id + '">Open portal</button></td></tr>';
    }).join("") + '</tbody></table></div>';
}

        '<td><span class="badge badge-green">Member</span></td>' +
        '<td class="tiny mono tnum">' + used + '/' + c.quoteLimit +
          '<div class="tiny dim">per ' + c.cycleDays + 'd</div></td>' +
        '<td class="right tnum">' + quotesFor(c.id).length + '</td>' +
        '<td class="right tnum">' + itemsForClient(c).length + '</td>' +
        '<td class="right"><button class="btn btn-sm" data-openclient="' + c.id + '">Open portal</button></td>' +

    }).join("") + '</tbody></table></div></div>';
}

function adminCatalog() {
  return '<p class="muted" style="margin-bottom:1rem;max-width:66ch;font-size:.95rem">' +
    'What the floor can build, with our own costing. Nothing here is public. An item reaches a ' +
    'client\'s portal when it carries a <strong>tag</strong> that client also carries — one tag opens ' +
    'a whole range to a whole segment at once, and a client can hold as many tags as you like.</p>' +
    '<div class="row wrap" style="gap:.4rem;margin-bottom:1.5rem;align-items:center">' +
      '<span class="stat-label">Tags in use</span>' +
      allTags().map(function (t) {
        return '<span class="tag" title="' + t.items + ' items, ' + t.members + ' members">' +
          esc(t.tag) + ' · ' + t.items + '/' + t.members + '</span>';
      }).join("") + '<span class="tiny dim">items / members</span></div>' +
    '<div class="card card-flush"><div class="table-wrap"><table class="data"><thead><tr>' +
      '<th>SKU</th><th>Item</th><th>Tags</th><th class="right">Unit</th>' +
      '<th class="right">MOQ</th><th class="right">Lead</th><th class="right">Reaches</th></tr></thead><tbody>' +
    CATALOG.map(function (it) {
      var reach = clientsForItem(it);
      return '<tr><td class="mono tiny">' + esc(it.sku) + '</td>' +
        '<td style="font-weight:500">' + esc(it.name) + '<div class="tiny dim">' + esc(it.cat) + '</div></td>' +
        '<td class="tag-row">' + ((it.tags || []).length
          ? it.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("")
          : '<span class="tiny dim">untagged</span>') + '</td>' +
        '<td class="right mono tnum">' + money(it.price) + '</td>' +
        '<td class="right tnum">' + it.moq.toLocaleString("en-US") + '</td>' +
        '<td class="right tiny">' + it.lead + 'd</td>' +
        '<td class="right">' + (reach.length
          ? '<span class="badge badge-green">' + reach.map(function (c) { return esc(c.name); }).join(", ") + '</span>'
          : '<span class="badge badge-slate">no one</span>') + '</td></tr>';
    }).join("") + '</tbody></table></div></div>';
}

function adminClients() {
  return '<p class="muted" style="margin-bottom:1.5rem;max-width:62ch;font-size:.95rem">' +
    'Open any client\'s portal exactly as they see it — their quotes, their cycle, their products. ' +
    'Nothing is shared between accounts.</p>' +
    '<div class="grid grid-3">' + CLIENTS.map(function (c) {
      var used = cycleUsed(c.id);
      return '<div class="card"><div class="row-between" style="align-items:flex-start">' +
        '<div><div class="tiny mono dim">' + esc(c.ref) + '</div>' +
        '<h3 style="margin-top:.25rem">' + esc(c.name) + '</h3>' +
        '<div class="tiny muted">' + esc(c.contact) + '</div></div>' +
        '<span class="badge badge-green">Member</span></div>' +
        '<dl class="kv" style="margin-top:1.1rem;grid-template-columns:110px minmax(0,1fr);font-size:.82rem">' +
          '<dt>Quotes</dt><dd class="tnum">' + quotesFor(c.id).length + '</dd>' +
          '<dt>Cycle used</dt><dd class="tnum">' + used + ' of ' + c.quoteLimit + '</dd>' +
          '<dt>Products</dt><dd>' + (itemsForClient(c).length || "none") + '</dd>' +
        '</dl>' +
        '<div class="row" style="gap:.5rem;margin-top:1.25rem">' +
          '<button class="btn btn-primary btn-sm grow" data-openclient="' + c.id + '">Open dashboard</button>' +
          '<button class="btn btn-sm" data-client="' + c.id + '">Record</button>' +
        '</div></div>';
    }).join("") + '</div>';
}

function adminClientHead() {
  var c = client(S.adminClient);
  return [c.ref + " · client record", c.name];
}
function adminClientBody() {
  var c = client(S.adminClient), qs = quotesFor(c.id), used = cycleUsed(c.id);
  return '<button class="btn btn-sm" data-atab="crm" style="margin-bottom:1.5rem">← Back to CRM</button>' +
    '<div class="grid grid-4">' +
      stat("Quote requests", qs.length, "all time") +
      stat("Cycle used", used + " / " + c.quoteLimit, "per " + c.cycleDays + " days") +
      stat("Products they can order", itemsForClient(c).length,
           itemsForClient(c).length ? "via their tags" : "quote-only account") +
      stat("Member since", fmtDate(c.memberSince, {month:"short", year:"numeric"}), esc(c.owner)) +
    '</div>' +
    '<div class="grid grid-sidebar" style="margin-top:1.5rem">' +
      '<div class="card card-flush"><div class="card-head"><h3>Their quote requests</h3>' +
        '<button class="btn btn-primary btn-sm" data-openclient="' + c.id + '">Open their portal</button></div>' +
        quoteTable(qs) + '</div>' +
      '<div class="stack">' +
        '<div class="card"><div class="stat-label">Catalog tags</div>' +
          '<p class="tiny muted" style="margin-top:.5rem">Give this account a tag and every item carrying ' +
          'it appears in their portal straight away. Click to toggle.</p>' +
          '<div class="tag-row" style="margin-top:.85rem">' + allTags().map(function (t) {
            var on = (c.tags || []).indexOf(t.tag) !== -1;
            return '<button class="tag ' + (on ? "tag-green" : "tag-muted") + '" ' +
              'style="cursor:pointer" data-tag="' + c.id + ':' + esc(t.tag) + '">' +
              (on ? "✓ " : "+ ") + esc(t.tag) + '</button>';
          }).join("") + '</div></div>' +
        '<div class="card"><div class="stat-label">Contact</div><dl class="kv" style="margin-top:.85rem;grid-template-columns:80px minmax(0,1fr);font-size:.85rem">' +
          '<dt>Name</dt><dd>' + esc(c.contact) + '</dd>' +
          '<dt>Email</dt><dd class="mono tiny">' + esc(c.email) + '</dd>' +
          '<dt>Phone</dt><dd class="mono tiny">' + esc(c.phone) + '</dd>' +
          '<dt>Where</dt><dd>' + esc(c.city) + ', ' + esc(c.country) + '</dd></dl></div>' +
        '<div class="card"><div class="stat-label">What they can order</div>' +
          (itemsForClient(c).length
            ? '<div class="stack-sm" style="margin-top:.75rem">' + itemsForClient(c).map(function (m) {
                return '<div class="row-between" style="gap:.75rem">' +
                  '<span style="font-size:.85rem">' + esc(m.item.name) + '</span>' +
                  '<span class="mono tiny">' + money(m.item.price) + '</span></div>';
              }).join("") + '</div>'
            : '<p class="tiny muted" style="margin-top:.6rem">Nothing yet — no tag on this account ' +
              'matches a catalog item, so their portal is quote-only.</p>') +
          '<button class="btn btn-sm btn-block" style="margin-top:.9rem" data-atab="catalog">Open the catalog</button></div>' +
      '</div></div>';
}

/* ==========================================================================
   Render + events
   ========================================================================== */
function render() {
  var app = document.getElementById("app");
  var isAdmin = S.route === "admin";
  document.body.className = isAdmin ? "workshop" : "showroom";

  var html;
  switch (S.route) {
    case "home":        html = viewHome(); break;
    case "catalogue":   html = viewCatalogue(); break;
    case "catalogue-item": html = viewCatalogueItem(); break;
    case "receipt":     html = topbar() + viewReceipt() + footer(); break;
    case "how":         html = viewHow(); break;
    case "membership":  html = viewMembership(); break;
    case "quote":       html = viewQuote(); break;
    case "quote-done":  html = viewQuoteDone(); break;
    case "apply":       html = viewApply(); break;
    case "apply-done":  html = viewApplyDone(); break;
    case "login":       html = viewLogin(); break;
    case "portal":      html = viewPortal(); break;
    case "quote-member":html = viewMemberQuote(); break;
    case "checkout":    html = viewCheckout(); break;
    case "paid":        html = viewPaid(); break;
    case "admin":       html = viewAdmin(); break;
    default:            html = viewHome();
  }
  app.innerHTML = (S.route === "login" ? "" : demoBar()) + html;

  if (S.route === "admin" && S.adminTab === "revenue" && !S.adminClient) {
    var host = document.getElementById("chart");
    if (host) renderChart(host, S.range);
  }
  wire();
}

function wire() {
  var app = document.getElementById("app");

  app.querySelectorAll("[data-act]").forEach(function (el) {
    el.addEventListener("click", function (e) {
      e.preventDefault();
      var act = el.getAttribute("data-act");
      if (act === "logout") { S.user = null; S.flash = ""; go("home"); return; }
      if (act === "admin-demo") { S.user = {kind:"admin"}; S.adminClient = null; S.adminTab = "revenue"; go("admin"); return; }
      if (act === "client-demo") { S.user = {kind:"client", id:1}; S.portalTab = "overview"; go("portal"); return; }
      if (act === "portal" && !S.user) { go("login"); return; }
      /* "Request a detailed quote" was a second door onto the same act, with
         its own form and its own record. It is the intake tab now — one door,
         so every entry point leads to the same page rather than to a rival of
         it. Signed-out visitors still get the public quote form. */
      if (act === "quote-member") {
        if (!S.user) { go("login"); return; }
        S.portalTab = "intake"; S.flash = ""; go("portal"); return;
      }
      if (act === "admin" && (!S.user || S.user.kind !== "admin")) { go("login"); return; }
      go(act);
    });
  });

  app.querySelectorAll("[data-atab]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.adminTab = el.getAttribute("data-atab"); S.adminClient = null; go("admin");
    });
  });
  app.querySelectorAll("[data-ptab]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.portalTab = el.getAttribute("data-ptab"); S.flash = ""; go("portal");
    });
  });
  app.querySelectorAll("[data-client]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.adminClient = parseInt(el.getAttribute("data-client"), 10); S.adminTab = "crm"; go("admin");
    });
  });
  app.querySelectorAll("[data-openclient]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.user = {kind:"client", id: parseInt(el.getAttribute("data-openclient"), 10)};
      S.portalTab = "overview"; S.flash = ""; go("portal");
    });
  });
  app.querySelectorAll("[data-range]").forEach(function (el) {
    el.addEventListener("click", function () { S.range = el.getAttribute("data-range"); go("admin"); });
  });

  app.querySelectorAll("[data-cat]").forEach(function (el) {
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      S.catSku = el.getAttribute("data-cat");
      go("catalogue-item");
    });
  });

  app.querySelectorAll("[data-iv]").forEach(wireViewer);

  var chips = app.querySelector(".chips");
  if (chips) chips.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip"); if (!chip) return;
    chips.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
    chip.setAttribute("aria-pressed", "true");
    app.querySelector("#chipNote").innerHTML =
      '<span class="mono">&rarr;</span> ' + esc(chip.getAttribute("data-inote"));
  });
  app.querySelectorAll("[data-intake]").forEach(function (el) {
    el.addEventListener("click", function () {
      var summary = (app.querySelector("#inSummary") || {}).value || "";
      if (!summary.trim()) { app.querySelector("#inSummary").focus(); return; }
      var w = +(app.querySelector('input[name="inw"]:checked') || {}).value || 2;
      var n = DR_ITEMS.length + 1;
      var ref = "MMI-D-" + String(n).padStart(3, "0");
      /* One door. Describing something badly and asking for a quote were two
         acts writing two unconnected records — a quote with a reference and a
         24-hour clock but no product, or a product with neither. One submission
         now opens all three: the request, the product it becomes, and the
         weighted debit that links them. */
      var c = client(S.user.id);
      var qref = "MMI-Q-" + (QUOTES.length + S.submitted.length + 1001);
      S.submitted.push({
        ref: qref, clientId: c.id, title: summary.trim(),
        qty: null, unit: null, total: null, status: "NEW",
        created: TODAY, due: addDays(TODAY, 1), itemRef: ref
      });
      DR_ITEMS.unshift({
        ref: ref, auto: "Unapproved item " + String(n).padStart(3, "0"), name: "",
        status: "pending", stage: 1, quoteRef: qref,
        source: "Sent from the portal",
        outstanding: "Nothing yet. We will come back within 24 hours with a structured " +
          "draft, and a named engineer signs it before it becomes a price."
      });
      /* The debit is recorded with the request, so the header and the ledger
         cannot disagree about what was charged. */
      CAPACITY.rows.unshift({label: summary.trim().slice(0, 120), weight: w,
                             classified: INTAKE_WEIGHTS.filter(function (x) { return x[0] === w; })[0][1],
                             outcome: "In progress", charged: w});
      CAPACITY.used += w; CAPACITY.left = Math.max(0, CAPACITY.total - CAPACITY.used);
      S.drRef = ref; S.portalTab = "products"; go("portal");
    });
  });
  app.querySelectorAll("[data-box]").forEach(function (el) {
    el.addEventListener("click", function () {
      BOXES.unshift({ref: "MMI-BOX-" + (4001 + BOXES.length), stage: 0});
      go(S.route);
    });
  });

  app.querySelectorAll("[data-dr]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.drRef = el.getAttribute("data-dr");
      /* Opening a product from the request list has to land on the product. */
      if (S.route === "portal") { S.portalTab = "products"; }
      go(S.route);
    });
  });
  var drRange = app.querySelector("#drQtyRange");
  if (drRange) {
    var out = app.querySelector("#drQty");
    drRange.addEventListener("input", function () { out.textContent = num(+drRange.value); });
    drRange.addEventListener("change", function () {
      var it = drItem(S.drRef); it.view.qty = +drRange.value; go(S.route);
    });
  }
  var drTarget = app.querySelector("#drTarget");
  if (drTarget) drTarget.addEventListener("change", function () {
    var it = drItem(S.drRef);
    it.view.target = Math.round((parseFloat(drTarget.value) || 0) * 100);
    go(S.route);
  });
  app.querySelectorAll("[data-drmode]").forEach(function (el) {
    el.addEventListener("click", function () {
      drItem(S.drRef).view.mode = el.getAttribute("data-drmode"); go(S.route);
    });
  });
  app.querySelectorAll("[data-drtool]").forEach(function (el) {
    el.addEventListener("click", function () {
      drItem(S.drRef).view.treatment = el.getAttribute("data-drtool") || null; go(S.route);
    });
  });
  app.querySelectorAll("[data-drlever]").forEach(function (el) {
    el.addEventListener("change", function () {
      var it = drItem(S.drRef), k = el.getAttribute("data-drlever");
      it.view.levers[k] = el.checked; go(S.route);
    });
  });
  var drName = app.querySelector("#drnm");
  if (drName) drName.addEventListener("change", function () {
    drItem(S.drRef).name = drName.value.trim(); go(S.route);
  });

  app.querySelectorAll("[data-lperiod]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.ledgerPeriod = el.getAttribute("data-lperiod");
      go(S.route);
    });
  });
  app.querySelectorAll("[data-lsearch]").forEach(function (el) {
    el.addEventListener("click", function () {
      function val(id) { var e = app.querySelector(id); return e && e.value.trim() ? e.value.trim() : null; }
      S.ledgerFilters = {start: val("#lf-start"), end: val("#lf-end"),
                         member: val("#lf-member"), orderRef: val("#lf-order"),
                         receipt: val("#lf-receipt")};
      go(S.route);
    });
  });
  app.querySelectorAll("[data-lclear]").forEach(function (el) {
    el.addEventListener("click", function () { S.ledgerFilters = {}; go(S.route); });
  });
  app.querySelectorAll("[data-receipt]").forEach(function (el) {
    el.addEventListener("click", function () {
      S.receipt = el.getAttribute("data-receipt");
      go("receipt");
    });
  });

  app.querySelectorAll("[data-buy]").forEach(function (el) {
    el.addEventListener("click", function () {
      var sku = el.getAttribute("data-buy");
      var it = CATALOG.filter(function (x) { return x.sku === sku; })[0];
      S.cart = {sku: sku, qty: it.moq};
      go("checkout");
    });
  });
  app.querySelectorAll("[data-copy]").forEach(function (el) {
    el.addEventListener("click", function () {
      var text = el.getAttribute("data-copy");
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { el.textContent = "Copied"; });
      } else { el.textContent = text; }
    });
  });
  app.querySelectorAll("[data-tag]").forEach(function (el) {
    el.addEventListener("click", function () {
      var parts = el.getAttribute("data-tag").split(":");
      var c = client(parseInt(parts[0], 10)), tag = parts[1];
      c.tags = c.tags || [];
      var i = c.tags.indexOf(tag);
      if (i === -1) { c.tags.push(tag); } else { c.tags.splice(i, 1); }
      go("admin");
    });
  });
  app.querySelectorAll("[data-triage]").forEach(function (el) {
    el.addEventListener("click", function () {
      var parts = el.getAttribute("data-triage").split(":");
      var action = parts[0], ref = parts[1];
      var q = QUOTES.concat(S.submitted).filter(function (x) { return x.ref === ref; })[0];
      if (!q) return;
      if (action === "accept") {
        q.status = "IN_REVIEW"; q.triaged = TODAY;
      } else {
        var box = app.querySelector('[data-reason="' + ref + '"]');
        var reason = box && box.value.trim();
        if (!reason) { if (box) { box.focus(); box.style.borderColor = "var(--stop)"; } return; }
        q.status = "REJECTED"; q.triaged = TODAY; q.reason = reason;
      }
      go("admin");
    });
  });

  var qtyEl = app.querySelector("#qty");
  if (qtyEl) {
    var it = CATALOG.filter(function (x) { return x.sku === S.cart.sku; })[0];
    qtyEl.addEventListener("input", function () {
      var q = Math.max(it.moq, parseInt(qtyEl.value, 10) || it.moq);
      S.cart.qty = q;
      go("checkout");   // quantity changes the freight estimate too, so re-price the lot
    });
  }
  var payForm = app.querySelector("#pay-form");
  if (payForm) {
    var paint = function () {
      var el = payForm.querySelector('input[name="method"]:checked');
      if (!el) return;
      app.querySelector("#proc").textContent = el.dataset.feeText;
      app.querySelector("#total").textContent = el.dataset.totalText;
      app.querySelector("#paybtn").textContent = "Pay " + el.dataset.totalText;
      app.querySelector("#proc-method").textContent = "\u2014 " + el.dataset.label.toLowerCase();
      app.querySelector("#proc-note").textContent = el.dataset.rate;
    };
    payForm.querySelectorAll('input[name="method"]').forEach(function (el) {
      el.addEventListener("change", paint);
    });
    paint();
  }
  if (payForm) payForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var it = CATALOG.filter(function (x) { return x.sku === S.cart.sku; })[0];
    var method = payForm.querySelector('input[name="method"]:checked').value;
    var ach = method === "ach";
    var q = S.quote, opt = q.opts.filter(function (o) { return o.key === method; })[0];
    S.placed.push({
      ref: "MMI-O-" + (2600 + S.placed.length), clientId: S.user.id, sku: it.sku, name: it.name,
      unit: it.price, qty: S.cart.qty, method: ach ? "ACH" : "CARD",
      goods: q.goods, freightEstimate: q.est.total, freightWaived: q.waived,
      freightCharged: q.charged, convenienceFee: q.fee, processingFee: opt.fee, total: opt.total,
      ordered: TODAY, paid: ach ? null : TODAY, reviewed: null, production: null,
      shipped: null, delivered: null, carrier: null, tracking: null,
      status: ach ? "PENDING" : "IN_REVIEW"
    });
    S.cart = null;
    go("paid");
  });

  var login = app.querySelector("#login-form");
  if (login) login.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = (login.user.value || "").trim(), p = (login.pass.value || "").trim();
    if (u === "Tyler1" && p === "Tyler1") {
      S.user = {kind:"admin"}; S.adminTab = "revenue"; S.adminClient = null; go("admin"); return;
    }
    var m = /^client([1-5])$/i.exec(u);
    if (m && p.toLowerCase() === "client") {
      S.user = {kind:"client", id: parseInt(m[1], 10)}; S.portalTab = "overview"; go("portal"); return;
    }
    S.loginError = "Those credentials don't match an account. Try Tyler1 / Tyler1, or client1 / client.";
    render();
  });

  var qf = app.querySelector("#quote-form");
  if (qf) qf.addEventListener("submit", function (e) { e.preventDefault(); go("quote-done"); });
  var af = app.querySelector("#apply-form");
  if (af) af.addEventListener("submit", function (e) { e.preventDefault(); go("apply-done"); });

  var mq = app.querySelector("#member-quote-form");
  if (mq) mq.addEventListener("submit", function (e) {
    e.preventDefault();
    var c = client(S.user.id);
    if (cycleUsed(c.id) >= c.quoteLimit) return;
    var n = QUOTES.length + S.submitted.length + 1001;
    S.submitted.push({
      ref: "MMI-Q-" + n, clientId: c.id,
      title: (mq.title.value || "New project").trim(),
      qty: parseInt(mq.qty.value, 10) || null, unit: null, total: null,
      status: "NEW", created: TODAY, due: addDays(TODAY, 1)
    });
    S.flash = "Sent to the floor. A landed price comes back within 24 hours.";
    S.portalTab = "overview";
    go("portal");
  });
}

render();
})();
</script>
